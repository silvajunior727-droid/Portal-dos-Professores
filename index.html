window.salvarEventoPeloCalendario = function() {
    const titulo = document.getElementById('modalTituloInput').value;
    const dataInicio = document.getElementById('modalDataInput').value;
    const checkPeriodoEl = document.getElementById('checkPeriodo');
    const isPeriodo = checkPeriodoEl ? checkPeriodoEl.checked : false;
    const dataFim = document.getElementById('modalDataFim').value;
    const cor = document.getElementById('modalColorInput').value || '#6f42c1';
    const desc = document.getElementById('modalDescInput') ? document.getElementById('modalDescInput').value : '';

    if (!titulo || !dataInicio) {
        alert("⚠️ Por favor, preencha o título e a data de início!");
        return;
    }

    let datasParaSalvar = [];

    // Lógica para montar a lista de dias (Um dia só ou um período longo)
    if (isPeriodo && dataFim) {
        if (dataFim < dataInicio) {
            alert("⚠️ A data final não pode ser antes da data de início!");
            return;
        }
        let dataAtual = new Date(dataInicio + "T12:00:00");
        let dataFinalObj = new Date(dataFim + "T12:00:00");

        while (dataAtual <= dataFinalObj) {
            const ano = dataAtual.getFullYear();
            const mes = String(dataAtual.getMonth() + 1).padStart(2, '0');
            const dia = String(dataAtual.getDate()).padStart(2, '0');
            datasParaSalvar.push(`${ano}-${mes}-${dia}`);
            dataAtual.setDate(dataAtual.getDate() + 1);
        }
    } else {
        datasParaSalvar.push(dataInicio);
    }

    // =========================================================================
    // A MÁGICA: O PAINEL ÚNICO DE EXCEÇÕES
    // =========================================================================
    let resumoExcecoes = [];
    datasParaSalvar.forEach(dataIso => {
        if (typeof window.verificarFeriadoOuExcecao === 'function') {
            const motivo = window.verificarFeriadoOuExcecao(dataIso);
            if (motivo) {
                const [ano, mes, dia] = dataIso.split('-');
                resumoExcecoes.push(`👉 ${dia}/${mes}/${ano} - ${motivo}`);
            }
        }
    });

    // Se encontrou alguma exceção no período, mostra o Painel Único
    if (resumoExcecoes.length > 0) {
        let textoExibicao = resumoExcecoes.slice(0, 10).join('\n');
        if (resumoExcecoes.length > 10) {
            textoExibicao += `\n... e mais ${resumoExcecoes.length - 10} dias com exceção no período.`;
        }

        const msgFinal = `⚠️ PAINEL DE EXCEÇÕES ⚠️\n\nO período selecionado contém ${resumoExcecoes.length} dias com exceções cadastradas:\n\n${textoExibicao}\n\nVocê tem total autonomia. Deseja registrar este evento em TODAS as DATAS?`;

        if (!confirm(msgFinal)) return; 
    }

    // =========================================================================
    // SALVAMENTO 
    // =========================================================
    let eventos = JSON.parse(localStorage.getItem('calendarEvents')) || [];
    
    const indexEdicao = document.getElementById('editIndex') ? document.getElementById('editIndex').value : "-1";
    let isEdicao = indexEdicao !== "-1";
    
    // Se for edição, remove o evento antigo da lista antes de adicionar o novo
    if (isEdicao) {
        eventos.splice(parseInt(indexEdicao), 1); 
        if (document.getElementById('editIndex')) document.getElementById('editIndex').value = "-1";
    }

    datasParaSalvar.forEach(dataIso => {
        eventos.push({ date: dataIso, title: titulo, color: cor, description: desc });
    });

    localStorage.setItem('calendarEvents', JSON.stringify(eventos));

    // Formatação de datas para Alerta e Log
    const dataIniBr = dataInicio.split('-').reverse().join('/');
    const detalheData = (isPeriodo && dataFim) ? `de ${dataIniBr} a ${dataFim.split('-').reverse().join('/')}` : `dia ${dataIniBr}`;

    // ==========================================
    // ALERTA DETALHADO E ESTILIZADO EM LISTA
    // ==========================================
    alert(`✅ Evento ${isEdicao ? 'editado' : 'salvo'} com sucesso!\n\nTítulo: ${titulo}\nPeríodo: ${detalheData}\nTotal de Dias: ${datasParaSalvar.length}`);

    // ==========================================
    // O ESPIÃO REGISTRA A AÇÃO (SEPARANDO NOVO DE EDIÇÃO)
    // ==========================================
    try {
        if (typeof registrarLog === 'function') {
            const acaoLog = isEdicao ? "EDIÇÃO NA AGENDA" : "REGISTRO NA AGENDA";
            const verboLog = isEdicao ? "Editou o evento" : "Cadastrou o evento";
            
            if (isPeriodo && dataFim) {
                const dataFimBr = dataFim.split('-').reverse().join('/');
                registrarLog(acaoLog, `${verboLog} em período (${dataIniBr} a ${dataFimBr}): "${titulo}" (${datasParaSalvar.length} dias).`);
            } else {
                registrarLog(acaoLog, `${verboLog} para o dia ${dataIniBr}: "${titulo}".`);
            }
        }
    } catch(e) { console.error("Erro no espião de salvamento do calendário:", e); }

    if (typeof fecharModal === 'function') fecharModal();
    if (typeof renderCalendarioAnual === 'function') renderCalendarioAnual();
    if (typeof renderEventTicker === 'function') renderEventTicker();
};

// 3. FUNÇÃO EXCLUIR COM AVISO (Com Espião Integrado)
function excluirEvento(data, titulo) {
    // 1. Carrega todos os eventos para podermos analisar
    let eventos = JSON.parse(localStorage.getItem('calendarEvents')) || [];
    
    // 2. Procura quantos eventos com esse mesmo título existem no calendário
    let eventosVinculados = eventos.filter(e => e.title === titulo);
    
    // 3. Formata a data clicada para o padrão BR
    const [ano, mes, dia] = data.split('-');
    const dataBrSelecionada = `${dia}/${mes}/${ano}`;

    // =========================================================================
    // CENÁRIO A: O EVENTO FAZ PARTE DE UN PERÍODO (Múltiplos Dias)
    // =========================================================================
    if (eventosVinculados.length > 1) {
        
        // Descobre a primeira e a última data automaticamente
        let datasOrdenadas = eventosVinculados.map(e => e.date).sort();
        let dataIniBr = datasOrdenadas[0].split('-').reverse().join('/');
        let dataFimBr = datasOrdenadas[datasOrdenadas.length - 1].split('-').reverse().join('/');

        const msgMultiplos = `🚨 ALERTA DE EXCLUSÃO EM MASSA 🚨\n\nO evento "${titulo}" está registrado em ${eventosVinculados.length} dias no seu calendário.\nPeríodo: de ${dataIniBr} até ${dataFimBr}.\n\nESCOLHA UMA OPÇÃO:\n👉 Clique em [OK] para APAGAR TODOS os dias deste período.\n👉 Clique em [CANCELAR] para apagar APENAS o dia que você clicou (${dataBrSelecionada}).`;

        if (confirm(msgMultiplos)) {
            // O Professor clicou em OK -> Apagar tudo!
            if (confirm(`Tem certeza absoluta? Você está prestes a apagar TODOS os ${eventosVinculados.length} dias do evento "${titulo}".\n\nEsta ação não poderá ser desfeita!`)) {
                eventos = eventos.filter(e => e.title !== titulo);
                
                // ==========================================
                // O ESPIÃO REGISTRA A EXCLUSÃO EM MASSA
                // ==========================================
                try {
                    registrarLog("EXCLUSÃO NA AGENDA", `Excluiu em massa todos os ${eventosVinculados.length} dias do evento "${titulo}" (Período: ${dataIniBr} a ${dataFimBr}).`);
                } catch(e) { console.error("Erro no espião da agenda (massa):", e); }

                atualizarTelaAposExclusao(eventos, data);
            }
        } else {
            // O Professor clicou em Cancelar -> Tentar apagar apenas um dia!
            const msgUmDia = `Deseja excluir APENAS o evento do dia ${dataBrSelecionada}?`;
            if (confirm(msgUmDia)) {
                eventos = eventos.filter(e => !(e.date === data && e.title === titulo));
                
                // ==========================================
                // O ESPIÃO REGISTRA A EXCLUSÃO DE UM DIA
                // ==========================================
                try {
                    registrarLog("EXCLUSÃO NA AGENDA", `Excluiu apenas o dia ${dataBrSelecionada} do evento "${titulo}".`);
                } catch(e) { console.error("Erro no espião da agenda (dia único):", e); }

                atualizarTelaAposExclusao(eventos, data);
            }
        }
    } 

    // =========================================================================
    // CENÁRIO B: O EVENTO É DE UM DIA SÓ
    // =========================================================================
    else {
        const msgUnico = `🚨 ALERTA DE EXCLUSÃO DEFINITIVA 🚨\n\nVocê está prestes a apagar o seguinte registro da agenda:\n\n📌 Evento: "${titulo}"\n📅 Data: ${dataBrSelecionada}\n\nTem certeza absoluta? Esta ação não poderá ser desfeita!`;
        
        if (confirm(msgUnico)) {
            eventos = eventos.filter(e => !(e.date === data && e.title === titulo));
            
            // ==========================================
            // O ESPIÃO REGISTRA A EXCLUSÃO DO EVENTO ÚNICO
            // ==========================================
            try {
                registrarLog("EXCLUSÃO NA AGENDA", `Excluiu o evento único "${titulo}" do dia ${dataBrSelecionada}.`);
            } catch(e) { console.error("Erro no espião da agenda (único):", e); }

            atualizarTelaAposExclusao(eventos, data);
        }
    }
}

function gerarPromptFinal() {
    const aluno = document.getElementById('rep-aluno').value;
    
    // --- NOVO: CAPTURA DE MÚLTIPLAS MATÉRIAS ---
    const checks = document.querySelectorAll('.chk-materia:checked');
    const materia = Array.from(checks).map(c => c.value).join(', ') || 'Nenhuma matéria selecionada';
    // ------------------------------------------

    const tamanho = document.getElementById('rep-tamanho').value;
    const bimestre = document.getElementById('rep-bimestre').value;
    const ano = document.getElementById('rep-ano').value;
    
    // TRATAMENTO DO TIPO: Pega só a primeira palavra (ex: tira o "Abrange todos os aspectos")
    const tipoCompleto = document.getElementById('rep-tipo').value;
    const tipoLimpo = tipoCompleto.split(" ")[0]; // Fica só "Geral" ou "Pedagógico"
    
    // Pega a data de hoje para mandar a IA assinar
    const dataHoje = new Date().toLocaleDateString('pt-BR');

    // Pegamos o conteúdo do mural
    let mural = document.getElementById('mural-lista').innerText;
    
    // Se o mural ainda estiver carregando ou vazio, avisamos a IA
    if (mural.includes("Buscando") || mural.includes("Nenhuma observação")) {
        mural = "O professor não inseriu observações específicas, faça um relatório padrão.";
    }

    const prompt = `Aja como um professor altamente qualificado do Colégio GP. 
Escreva um Relatório ${tipoLimpo} de tamanho ${tamanho} para o aluno(a) ${aluno}, referente à disciplina de ${materia} no ${bimestre} de ${ano}. 
Use como base as seguintes observações: "${mural}". 
O texto deve ser profissional e construtivo.

REGRA MILITAR DE FORMATAÇÃO (OBRIGATÓRIO):
1. NÃO use negrito, marcadores, nem coloque nenhum espaço antes de começar a escrever as linhas. Comece sempre no canto esquerdo.
2. A primeira linha da sua resposta deve ser exatamente assim (em letras maiúsculas):
RELATÓRIO ${tipoLimpo.toUpperCase()} - ${bimestre.toUpperCase()} DE ${ano}
3. A segunda linha (sem pular linha):
Disciplina: ${materia}
4. A terceira linha (sem pular linha):
Instituição: Colégio GP
5. Pule UMA linha em branco e comece os parágrafos do relatório (Não escreva o nome do aluno aqui).
6. Após o último ponto final do último parágrafo, pule EXATAMENTE 4 LINHAS EM BRANCO.
7. Termine o texto com essas 3 linhas exatas (sem pular linha entre elas):
Atenciosamente,
Equipe Pedagógica - Colégio GP
Emitido em ${dataHoje}`;

    document.getElementById('display-prompt').style.display = 'block';
    document.getElementById('texto-prompt-copia').value = prompt;
}

// 3. A função que "LIGA" para o SEU SERVIDOR e pede o relatório
async function gerarRelatorioMágico() {
    
    // --- 1. COLETA DE DADOS (ISSO NÃO MUDA) ---
    const turma = document.getElementById('rep-turma').value;
    const alunoNome = document.getElementById('rep-aluno').value;
    const bimestre = document.getElementById('rep-bim').value;
    const tipo = document.getElementById('rep-tipo').value;
    const rascunhoProfessor = document.getElementById('rep-obs').value;

    if (!turma || !alunoNome) return alert("Escolha o aluno primeiro!");
    
    // Mostra o robô pensando
    document.getElementById('status-ia').style.display = 'block';

    // Monta o pedido (Prompt)
    const comandoParaIA = `Você é um professor do Colégio GP. Escreva um relatório escolar do tipo ${tipo} para o aluno(a) ${alunoNome}, da turma ${turma}, do ${bimestre}º bimestre. Observações: ${rascunhoProfessor}. Use um tom profissional e acolhedor.`;

    // --- 2. AQUI ESTÁ A MUDANÇA (CONEXÃO COM SEU SERVIDOR) ---
    try {
        // console.log("🕵️ Robô indo falar com o servidor do Colégio...");

        // Chama o seu backend (server.js)
        // Tente assim agora (com localhost e a barra no final)
const resposta = await fetch("http://localhost:3001/relatorio", {
    method: "POST", // Isso é muito importante!
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        prompt: comandoParaIA
    })
});

        if (!resposta.ok) {
            throw new Error("Erro ao gerar relatório pela IA");
        }

        const dados = await resposta.json();

        // Se o servidor devolveu o texto, mostra na tela
        if (dados.texto) {
            const textoFinal = dados.texto;
            exibirFolhaRelatorio(alunoNome, turma, textoFinal);
        } else {
            alert("O robô chegou lá, mas voltou sem o relatório.");
        }

    } catch (erro) {
        console.error("Erro na comunicação com o servidor:", erro);
        
        alert(
          "🚨 Não foi possível gerar o relatório.\n\n" +
          "Verifique:\n" +
          "1. Se a janela preta do servidor (npm start) está aberta\n" +
          "2. Se há conexão com a internet"
        );

    } finally {
        // Esconde o robô pensando
        document.getElementById('status-ia').style.display = 'none';
    }
}

window.acaoProximaData = function() {
    const TABELA_BIMESTRES_2026 = {
        "1": { start: "2026-01-26", end: "2026-04-10", nome: "1º Bimestre" },
        "2": { start: "2026-04-13", end: "2026-06-30", nome: "2º Bimestre" },
        "3": { start: "2026-08-03", end: "2026-10-09", nome: "3º Bimestre" },
        "4": { start: "2026-10-12", end: "2026-12-18", nome: "4º Bimestre" }
    };

    const dataInput = document.getElementById('date-diary');
    const txtArea = document.getElementById('txt-diary');
    const selMateria = document.getElementById('sel-diary-subj');
    const selBimestre = document.getElementById('sel-diary-bim');
    const turma = currentClassContext;

    if(!dataInput || !selMateria || !selBimestre) return alert("Erro: Elementos não encontrados.");

    const dataValor = dataInput.value;
    const numeroBimestre = selBimestre.value.replace(/[^0-9]/g, ''); 
    const materiaNome = selMateria.options[selMateria.selectedIndex].text.toUpperCase();
    const bimestreNomeExibicao = selBimestre.options[selBimestre.selectedIndex].text;

    const dataObj = new Date(dataValor + 'T12:00:00');
    const diasSemanaNomes = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
    const diaSemanaNome = diasSemanaNomes[dataObj.getDay()];
    const diaSemanaBusca = diaSemanaNome.replace('-FEIRA', '').toLowerCase();
    const dataFormatada = dataValor.split('-').reverse().join('/');

    let listaDeErros = [];

    // CAMADA 1: CALENDÁRIO
    if (dataObj.getDay() === 0 || dataObj.getDay() === 6) {
        listaDeErros.push(`❌ FIM DE SEMANA: ${diaSemanaNome} não costuma ser dia letivo.`);
    }
    if (typeof FIXED_BLOCKED_2026 !== 'undefined' && FIXED_BLOCKED_2026[dataValor]?.blocked) {
        listaDeErros.push(`🚫 FERIADO: ${FIXED_BLOCKED_2026[dataValor].label}`);
    }

    // CAMADA 2: AGENDA (Aviso obrigatório para todas as aulas)
    listaDeErros.push(`🚫 AGENDA: Você está gravando Aula de ${materiaNome} em uma ${diaSemanaNome} - É isso mesmo?`);

    // CAMADA 3: ANTI-DUPLICIDADE
    const jaExiste = window.memoriaDiario && window.memoriaDiario.some(reg => reg.data === dataValor && reg.materia.toUpperCase() === materiaNome);
    if (jaExiste) {
        listaDeErros.push(`⚠️ DUPLICIDADE: Já existe um registro de ${materiaNome} nesta data!`);
    }

    // CAMADA 4: BIMESTRE
    const regraBimestre = TABELA_BIMESTRES_2026[numeroBimestre];
    if (regraBimestre) {
        if (dataValor < regraBimestre.start || dataValor > regraBimestre.end) {
            const inicioBR = regraBimestre.start.split('-').reverse().join('/');
            const fimBR = regraBimestre.end.split('-').reverse().join('/');
            listaDeErros.push(`📅 BIMESTRE: A data ${dataFormatada} está fora do ${bimestreNomeExibicao} (Período: ${inicioBR} a ${fimBR}).`);
        }
    }

    // ALERTA QUE PERMITE GRAVAR
    if (listaDeErros.length > 0) {
        const autorizaGravar = confirm("⚠️ AVISOS DE ATENÇÃO:\n\n" + listaDeErros.join("\n\n") + "\n\nDeseja gravar o conteúdo mesmo com estes avisos?");
        if (!autorizaGravar) {
            return;
        }
    }

    // FINALIZAÇÃO E SALVAMENTO
    const conteudo = txtArea.value.trim();
    if (!conteudo) return alert("⚠️ Digite o conteúdo da aula.");

    const novoRegistro = {
        data: dataValor,
        conteudo: conteudo,
        bimestre: bimestreNomeExibicao,
        materia: materiaNome,
        dataRegistro: new Date().toLocaleString(),
        professor: (typeof currentUser !== 'undefined' && currentUser?.displayName) ? currentUser.displayName : "Professor"
    };

    if (!Array.isArray(window.memoriaDiario)) window.memoriaDiario = [];
    window.memoriaDiario.push(novoRegistro);

    if (typeof db !== 'undefined') {
        db.collection('classes').doc(turma).set({ 
            diarioConteudo: window.memoriaDiario 
        }, { merge: true })
        .then(() => {
            // ==========================================
            // O ESPIÃO REGISTRA A AÇÃO NO DIÁRIO!
            // ==========================================
            registrarLog("REGISTRO DE DIÁRIO", `Salvou conteúdo de ${materiaNome} na turma ${turma} para o dia ${dataFormatada}.`);

            if (typeof exibirFeedbackSucesso === 'function') exibirFeedbackSucesso(); 
            txtArea.value = "";
            dataInput.stepUp(); 
            txtArea.focus();
            
            if(document.getElementById("gestao-conteudo") && document.getElementById("gestao-conteudo").innerHTML.trim() !== "") {
                window.renderGestaoConteudo();
            }
        })
        .catch(err => alert("Erro ao salvar: " + err));
    }
};

<script>


window.addSlideUrl = function() {
    const input = document.getElementById('new-slide-url');
    
    // TRUQUE: Se a lista estiver vazia visualmente, tenta renderizar antes de adicionar
    const container = document.getElementById('lista-imagens-atuais');
    if (container && container.innerHTML === "") {
        if(typeof renderSlideList === 'function') renderSlideList();
    }

    const url = input.value.trim();
    if (!url) return alert("⚠️ Por favor, cole uma URL válida!");
    
    if (!config.slideshow.images) config.slideshow.images = [];
    config.slideshow.images.unshift(url);

    // ==========================================
    // 1. SALVAMENTO PROTEGIDO NO SISTEMA
    // ==========================================
    try {
        saveSystem();
    } catch(e) {
        console.error("Erro ao adicionar imagem:", e);
        // Desfaz a adição local caso o Firebase falhe
        config.slideshow.images.shift();
        return alert('❌ Erro ao salvar a nova foto no sistema: ' + (e.message || 'Erro desconhecido'));
    }

    const totalFotos = config.slideshow.images.length;
    // Se a URL for gigantesca, corta para não deformar o alerta e o log
    const urlCurta = url.length > 40 ? url.substring(0, 37) + '...' : url;

    // ==========================================
    // 2. O ESPIÃO REGISTRA A AÇÃO
    // ==========================================
    try {
        registrarLog("GALERIA DE FOTOS", `Adicionou uma nova imagem. Total de fotos agora: ${totalFotos}. (URL: ${urlCurta})`);
    } catch(e) { console.error("Erro no espião da galeria:", e); }
    
    // ==========================================
    // 3. ALERTA DETALHADO E ESTILIZADO EM LISTA
    // ==========================================
    alert(`✅ Imagem adicionada com sucesso!\n\nAção: Nova Foto na Galeria\nTotal Atual: ${totalFotos} foto(s) cadastradas\nURL: ${urlCurta}`);
    
    input.value = ""; 
    if(typeof renderSlideList === 'function') renderSlideList(); // Atualiza a lista visual

    // ==========================================
    // 4. MÁGICA CERTEIRA PARA MANTER A ABA ABERTA
    // ==========================================
    setTimeout(() => {
        if (input) {
            const abaConteudo = input.closest('.config-toggle-content') || input.closest('div[id*="content"]');
            if (abaConteudo) {
                abaConteudo.style.display = 'block';
                abaConteudo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }, 300);
};


// 2. Função auxiliar para mostrar o que já tem
function renderSlideList() {
    const container = document.getElementById('lista-imagens-atuais');
    // Se o elemento não existir na tela (modal fechado), para a execução
    if(!container) return; 

    if(!config.slideshow.images) config.slideshow.images = [];
    
    container.innerHTML = config.slideshow.images.map((img, index) => 
        `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:2px;">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:80%; font-size:12px;">${index+1}. ${img}</span>
            <span style="cursor:pointer; color:red; font-weight:bold;" onclick="removeSlide(${index})">✖</span>
         </div>`
    ).join('');
}

window.removeSlide = function(index) {
    // Pega a URL da imagem ANTES de apagar para o log e para o alerta
    const urlRemovida = config.slideshow.images[index];
    if (!urlRemovida) return; // Trava de segurança caso o índice seja inválido

    if(!confirm("🗑️ Deseja realmente remover esta imagem da galeria?")) return;

    // Remove a imagem da lista localmente
    config.slideshow.images.splice(index, 1);

    // ==========================================
    // 1. SALVAMENTO PROTEGIDO NO SISTEMA
    // ==========================================
    try {
        saveSystem();
    } catch(e) {
        console.error("Erro ao remover imagem:", e);
        // Desfaz a exclusão local (colocando a foto de volta no mesmo lugar) caso o Firebase falhe
        config.slideshow.images.splice(index, 0, urlRemovida);
        return alert('❌ Erro ao salvar a exclusão da foto no sistema: ' + (e.message || 'Erro desconhecido'));
    }

    const totalRestante = config.slideshow.images.length;
    // Encurta a URL para o alerta e log não ficarem deformados
    const urlCurta = urlRemovida.length > 40 ? urlRemovida.substring(0, 37) + '...' : urlRemovida;

    // ==========================================
    // 2. O ESPIÃO REGISTRA A AÇÃO
    // ==========================================
    try {
        registrarLog("GALERIA DE FOTOS", `Removeu uma imagem da galeria. Total restante: ${totalRestante}. (URL removida: ${urlCurta})`);
    } catch(e) { console.error("Erro no espião da galeria:", e); }

    // ==========================================
    // 3. ALERTA DETALHADO E ESTILIZADO EM LISTA
    // ==========================================
    alert(`✅ Imagem removida com sucesso!\n\nAção: Exclusão de Foto\nTotal Restante: ${totalRestante} foto(s)\nURL apagada: ${urlCurta}`);

    // Atualiza a lista na tela
    if(typeof renderSlideList === 'function') renderSlideList();

    // ==========================================
    // 4. MÁGICA CERTEIRA PARA MANTER A ABA ABERTA
    // ==========================================
    setTimeout(() => {
        // Usa a lista de slides como âncora
        const el = document.getElementById('lista-imagens-atuais') || document.getElementById('slide-list');
        if (el) {
            const abaConteudo = el.closest('.config-toggle-content') || el.closest('div[id*="content"]');
            if (abaConteudo) {
                abaConteudo.style.display = 'block';
                abaConteudo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }, 300);
};



window.clearSlides = function() {
    // Conta quantas fotos existem antes de apagar
    const totalFotos = config.slideshow && config.slideshow.images ? config.slideshow.images.length : 0;

    if (totalFotos === 0) {
        return alert("⚠️ A galeria já está vazia!");
    }

    if (!confirm(`🗑️ Atenção: Deseja realmente APAGAR TODAS as ${totalFotos} fotos da galeria?`)) return;

    // Limpa a lista de imagens
    config.slideshow.images = [];

    // ==========================================
    // 1. SALVAMENTO PROTEGIDO NO SISTEMA
    // ==========================================
    try {
        saveSystem();
    } catch(e) {
        console.error("Erro ao limpar a galeria:", e);
        return alert('❌ Erro ao salvar a exclusão das fotos no sistema: ' + (e.message || 'Erro desconhecido'));
    }

    // ==========================================
    // 2. O ESPIÃO REGISTRA A AÇÃO
    // ==========================================
    try {
        registrarLog("GALERIA DE FOTOS", `Apagou a galeria inteira (${totalFotos} imagem/imagens removida(s)).`);
    } catch(e) { console.error("Erro no espião da galeria:", e); }

    // ==========================================
    // 3. ALERTA DETALHADO E ESTILIZADO EM LISTA
    // ==========================================
    alert(`✅ Galeria limpa com sucesso!\n\nAção: Limpeza Total\nFotos Apagadas: ${totalFotos}\nStatus Atual: Nenhuma foto em exibição`);

    // Atualiza a lista na tela para sumir com as fotos antigas
    if(typeof renderSlideList === 'function') renderSlideList();

    // ==========================================
    // 4. MÁGICA CERTEIRA PARA MANTER A ABA ABERTA
    // ==========================================
    setTimeout(() => {
        // Usa a lista de slides ou o próprio botão como âncora
        const el = document.getElementById('slide-list') || document.querySelector('[onclick="clearSlides()"]');
        if (el) {
            const abaConteudo = el.closest('.config-toggle-content') || el.closest('div[id*="content"]');
            if (abaConteudo) {
                abaConteudo.style.display = 'block';
                abaConteudo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }, 300);
};

function exibirFeedbackSucesso() {
    // 1. Mensagem simples e direta (substitui o alerta de erro)
    alert("✅ Diário Registrado com Sucesso!");

    // 2. Lógica para sugerir a próxima data
    // Tenta localizar o campo de data (verifique se o ID do seu input é 'data-aula' ou similar)
    const campoData = document.getElementById('data-aula') || 
                      document.getElementById('modalDataInput') || 
                      document.querySelector('input[type="date"]');

    if (campoData && campoData.value) {
        // Cria a data atual baseada no input (compensando fuso horário)
        const dataAtual = new Date(campoData.value + "T12:00:00");
        
        // Pergunta estratégica
        const desejaAvancar = confirm(
            "Registro salvo!\n\nO dia 04/02 (hoje) já foi computado.\nDeseja avançar o calendário para a PRÓXIMA AULA (semana que vem)?"
        );

        if (desejaAvancar) {
            // Adiciona 7 dias (padrão de aula semanal)
            // Se suas aulas forem diárias, mude +7 para +1
            dataAtual.setDate(dataAtual.getDate() + 7);
            
            // Formata para o padrão do input (YYYY-MM-DD)
            const ano = dataAtual.getFullYear();
            const mes = String(dataAtual.getMonth() + 1).padStart(2, '0');
            const dia = String(dataAtual.getDate()).padStart(2, '0');
            const novaDataFormatada = `${ano}-${mes}-${dia}`;

            campoData.value = novaDataFormatada;
            
            // Opcional: Se você tiver uma função que carrega o conteúdo ao mudar a data, chame-a aqui.
            // Exemplo: carregarConteudoDaData(novaDataFormatada);
            
            alert(`📅 Calendário ajustado para: ${dia}/${mes}/${ano}`);
        }
    }
}

// 1. Preenche o Filtro
window.populateWeeklySubjects = function() {
    try {
        const select = document.getElementById('weekly-subject-filter');
        if(!select) return;

        const currentVal = select.value;
        select.innerHTML = '<option value="TODAS">Todas as Matérias</option>';

        const listaMaterias = ["portugues", "matematica", "ciencias", "geografia", "edfisica", "historia", "ingles", "arte"];
        const nomesBonitos = { 'portugues': 'Português', 'matematica': 'Matemática', 'ciencias': 'Ciências', 'geografia': 'Geografia', 'edfisica': 'Ed. Física', 'historia': 'História', 'ingles': 'Inglês', 'arte': 'Arte' };

        listaMaterias.forEach(mat => {
            let opt = document.createElement('option');
            opt.value = mat; opt.textContent = (nomesBonitos[mat] || mat).toUpperCase();
            select.appendChild(opt);
        });
        if(currentVal) select.value = currentVal;
    } catch(e) { console.error("Erro no filtro:", e); }
};


// 2. Renderiza as Janelas (AGORA LÊ DIRETAMENTE DO MASTERDATA ATUALIZADO)
window.renderWeekly = function() {
    try {
        const refDateInput  = document.getElementById('date-weekly-ref');
        const container     = document.getElementById('weekly-days-container');
        const filterSubject = document.getElementById('weekly-subject-filter') ? document.getElementById('weekly-subject-filter').value : "TODAS";
        
        if (!refDateInput || !container) return;
        
        if (!refDateInput.value) {
            const hoje = new Date();
            refDateInput.value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
        }

        // --- FORÇA A LEITURA DO DADO MAIS RECENTE ---
        let contextoTurma = (typeof currentClassContext !== 'undefined') ? currentClassContext : null;
        if (typeof masterData !== 'undefined' && contextoTurma && masterData[contextoTurma] && masterData[contextoTurma][0] && masterData[contextoTurma][0].semanarioConteudo) {
            window.memoriaSemanario = masterData[contextoTurma][0].semanarioConteudo;
        } else if (!Array.isArray(window.memoriaSemanario)) {
            window.memoriaSemanario = [];
        }

        const d = new Date(refDateInput.value + "T12:00:00");
        const diff = d.getDate() - d.getDay() + (d.getDay() === 0 ? -6 : 1);
        const monday = new Date(d.setDate(diff));

        container.innerHTML = "";
        const diasLabel = ["Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira"];
        let rangeText = "";

        let listaExcecoes = (typeof config !== 'undefined' && config.exceptions) ? config.exceptions : {};
        let agendaUso = (typeof agendaAulas !== 'undefined') ? agendaAulas : {};
        const mapNomes = { 'portugues': 'Português', 'matematica': 'Matemática', 'ciencias': 'Ciências', 'geografia': 'Geografia', 'edfisica': 'Ed. Física', 'historia': 'História', 'ingles': 'Inglês', 'arte': 'Arte' };

        for (let i = 0; i < 5; i++) {
            let loopDate = new Date(monday);
            loopDate.setDate(monday.getDate() + i);
            
            const dataKey   = `${loopDate.getFullYear()}-${String(loopDate.getMonth() + 1).padStart(2, '0')}-${String(loopDate.getDate()).padStart(2, '0')}`;
            const dataShow  = `${String(loopDate.getDate()).padStart(2, '0')}/${String(loopDate.getMonth() + 1).padStart(2, '0')}`;
            const agendaIndex = i + 1; 

            if (i === 0) rangeText += dataShow;
            if (i === 4) rangeText += " até " + dataShow;

            let isHolidayMonth = (loopDate.getMonth() === 0 || loopDate.getMonth() === 6);
            let isBlocked = isHolidayMonth || (listaExcecoes[dataKey] && listaExcecoes[dataKey].blocked) || (typeof isClassDateBlocked === 'function' && isClassDateBlocked(dataKey));
            let motivo = isHolidayMonth ? "Férias Escolares" : (isBlocked ? (listaExcecoes[dataKey]?.label || "Feriado/Recesso") : "");

            let materiasHoje = [];
            for (let mat in agendaUso) { if (Array.isArray(agendaUso[mat]) && agendaUso[mat].includes(agendaIndex)) materiasHoje.push(mat); }
            if (materiasHoje.length === 0) materiasHoje = ["portugues", "matematica", "ciencias", "geografia", "historia", "ingles", "arte"];

            materiasHoje.forEach(materiaKey => {
                if (filterSubject !== "TODAS" && filterSubject !== materiaKey) return;

                const registroSalvo = window.memoriaSemanario.find(x => x.data === dataKey && x.materiaKey === materiaKey);
                const conteudo = registroSalvo ? registroSalvo.conteudo : "";
                
                const nomeExibicao = (mapNomes[materiaKey] || materiaKey).toUpperCase();
                const storageKey = `${dataKey}_${materiaKey}_WEEKLY`;
                
                const bg = isBlocked ? "#fff5f5" : "#f9fef9";
                const border = isBlocked ? "#ef9a9a" : "#cfd8dc";
                const titleColor = isBlocked ? "#c62828" : "#2e7d32";
                
                const card = document.createElement('div');
                card.className = 'planner-day-card';
                card.style.cssText = `width: 100%; background:${bg}; border:1px solid ${border}; border-radius:8px; margin-bottom:15px; padding:12px; box-sizing: border-box;`;

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <div style="font-weight:bold; color:${titleColor}; font-size:14px;">${diasLabel[i]} <span style="font-weight:normal; color:#555; font-size:0.9em;">(${dataShow})</span></div>
                        <div><span style="background:${isBlocked ? '#ffebee' : '#e8f5e9'}; color:${titleColor}; padding:4px 8px; border-radius:4px; font-size:11px; border:1px solid ${border}; font-weight:bold;">${isBlocked ? '🚫 BLOQUEADO: ' : ''}${nomeExibicao}</span></div>
                    </div>
                    <textarea id="w-${storageKey}" data-storage-key="${storageKey}" data-materia="${materiaKey}" data-data="${dataKey}" rows="3" placeholder="${isBlocked ? `⚠️ ${motivo}...` : `Planejamento para ${nomeExibicao}...`}" style="width:100%; padding:10px; border:1px solid ${border}; border-radius:6px; resize:vertical; font-family:Arial; font-size:13px; background:#fff; text-align: justify; line-height: 1.5; white-space: pre-wrap; box-sizing: border-box;">${conteudo}</textarea>
                `;

            });
        }
        const displayRange = document.getElementById('weekly-range-display');
        if (displayRange) displayRange.innerHTML = `Exibindo a semana de <b>${rangeText}</b>`;

    } catch (erro) { console.error("Erro ao carregar Semanário:", erro); }
};


// 3. Função de SALVAR (Sincronizada e com Espião)
window.saveWeekly = function() {
    const container = document.getElementById('weekly-days-container');
    if(!container) return;
    
    let contextoTurma = (typeof currentClassContext !== 'undefined') ? currentClassContext : null;
    if(!contextoTurma) return alert("Selecione uma turma primeiro.");

    let inputs = container.querySelectorAll('textarea');
    let alterou = false;
    let detalhesAlerta = [];

    if (!Array.isArray(window.memoriaSemanario)) window.memoriaSemanario = [];

    inputs.forEach(el => {
        let val = el.value.trim();
        let dataKey = el.getAttribute('data-data');
        let materiaKey = el.getAttribute('data-materia');
        let index = window.memoriaSemanario.findIndex(x => x.data === dataKey && x.materiaKey === materiaKey);

        if (val !== "") {
            if (index >= 0) {
                if (window.memoriaSemanario[index].conteudo !== val) {
                    window.memoriaSemanario[index].conteudo = val;
                    alterou = true;
                    detalhesAlerta.push(`- ${materiaKey.toUpperCase()} (${dataKey.split('-').reverse().join('/')})`);
                }
            } else {
                window.memoriaSemanario.push({ data: dataKey, materiaKey: materiaKey, conteudo: val });
                alterou = true;
                detalhesAlerta.push(`- ${materiaKey.toUpperCase()} (${dataKey.split('-').reverse().join('/')})`);
            }
        } else if (val === "" && index >= 0) {
            window.memoriaSemanario.splice(index, 1);
            alterou = true;
            detalhesAlerta.push(`- [APAGADO] ${materiaKey.toUpperCase()} (${dataKey.split('-').reverse().join('/')})`);
        }
    });

    if(alterou && typeof db !== 'undefined') {
        db.collection('classes').doc(contextoTurma).set({
            semanarioConteudo: window.memoriaSemanario
        }, { merge: true })
        .then(() => {
            // --- A MÁGICA DA SINCRONIZAÇÃO ACONTECE AQUI ---
            if(typeof masterData !== 'undefined' && masterData[contextoTurma]) {
                if(!masterData[contextoTurma][0]) masterData[contextoTurma][0] = {};
                masterData[contextoTurma][0].semanarioConteudo = [...window.memoriaSemanario];
            }
            // -----------------------------------------------
            
            // ==========================================
            // O ESPIÃO REGISTRA A ATUALIZAÇÃO DO SEMANÁRIO
            // ==========================================
            try {
                registrarLog("REGISTRO DE SEMANÁRIO", `Atualizou o planejamento semanal da turma ${contextoTurma}. Itens salvos/modificados: ${detalhesAlerta.join(' | ')}`);
            } catch(e) { console.error("Erro no espião do semanário:", e); }

            alert(`✅ SEMANÁRIO ATUALIZADO COM SUCESSO!\n\nConteúdos Salvos:\n${detalhesAlerta.join('\n')}`);
            window.renderGestaoSemanario(); 
        }).catch(e => alert("Erro ao salvar: " + e));
    } else if (!alterou) {
        alert("Nenhuma alteração para salvar.");
    }
};

// Variável global para guardar a escolha do filtro
window.tipoFiltroGestaoSemanario = window.tipoFiltroGestaoSemanario || 'SEMANA';

window.mudarFiltroGestaoSemanario = function(valor) {
    window.tipoFiltroGestaoSemanario = valor;
    window.renderGestaoSemanario();
};

window.renderGestaoSemanario = function() {
    const container = document.getElementById('gestao-semanario-container');
    if (!container) return;

    let lista = Array.isArray(window.memoriaSemanario) ? window.memoriaSemanario.slice() : [];
    const refDateInput = document.getElementById('date-weekly-ref');
    
    let textoFiltro = "";

    // Aplica o filtro baseado na escolha
    if (refDateInput && refDateInput.value) {
        if (window.tipoFiltroGestaoSemanario === 'SEMANA') {
            const d = new Date(refDateInput.value + "T12:00:00");
            const diff = d.getDate() - d.getDay() + (d.getDay() === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            const friday = new Date(monday); 
            friday.setDate(monday.getDate() + 4);
            
            const mIso = monday.toISOString().split('T')[0];
            const fIso = friday.toISOString().split('T')[0];
            lista = lista.filter(x => x.data >= mIso && x.data <= fIso);
            textoFiltro = "da Semana Selecionada";
        } 
        else if (window.tipoFiltroGestaoSemanario === 'MES') {
            // Filtra pegando apenas o Ano e o Mês (ex: 2026-03)
            const anoMes = refDateInput.value.substring(0, 7); 
            lista = lista.filter(x => x.data.startsWith(anoMes));
            textoFiltro = "do Mês Selecionado";
        }
        else if (window.tipoFiltroGestaoSemanario === 'TUDO') {
            // Não filtra nada, mostra tudo que tem na memória!
            textoFiltro = "(Todos os Registros)";
        }
    }

    // Cria o cabeçalho já com o seletor de opções embutido!
    let html = `
    <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-top: 30px;">
        <h4 style="margin: 0; color: #333;">📋 Gestão de Planejamento <span style="font-size:14px; font-weight:normal; color:#666;">${textoFiltro}</span></h4>
        <select onchange="window.mudarFiltroGestaoSemanario(this.value)" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; font-size:12px; cursor:pointer; background-color: #f9f9f9; outline: none;">
            <option value="SEMANA" ${window.tipoFiltroGestaoSemanario === 'SEMANA' ? 'selected' : ''}>Apenas da Semana</option>
            <option value="MES" ${window.tipoFiltroGestaoSemanario === 'MES' ? 'selected' : ''}>Do Mês Inteiro</option>
            <option value="TUDO" ${window.tipoFiltroGestaoSemanario === 'TUDO' ? 'selected' : ''}>Todos os Registros</option>
        </select>
    </div>`;

    if (lista.length === 0) {
        html += `<div style="text-align: center; padding: 20px; color: #888; font-style: italic;">Nenhum conteúdo salvo para este filtro.</div>`;
        container.innerHTML = html;
        return;
    }

    html += `
    <table style="width:100%; border-collapse:collapse; margin-top:10px; font-family:sans-serif; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0;">
        <tr style="background:#f9f9f9;">
            <th style="padding:12px; border-bottom:1px solid #e0e0e0; text-align:center; width:100px;">Data</th>
            <th style="padding:12px; border-bottom:1px solid #e0e0e0; text-align:left; width:150px;">Matéria</th>
            <th style="padding:12px; border-bottom:1px solid #e0e0e0; text-align:left;">Conteúdo Salvo</th>
            <th style="padding:12px; border-bottom:1px solid #e0e0e0; text-align:center; width:90px;">Ação</th>
        </tr>`;

    // Normalizando a Tabela (Tirando \n igual você fez no seu código do diário)
    lista.sort((a,b) => new Date(a.data) - new Date(b.data)).forEach(item => {
        const safeText = item.conteudo.replace(/"/g, '&quot;').replace(/\n/g, ' ');
        const htmlText = item.conteudo.replace(/\n/g, '<br>');
        html += `
        <tr style="border-bottom: 1px solid #f0f0f0;">
            <td style="padding:10px; text-align:center; font-weight:bold;">${item.data.split('-').reverse().join('/')}</td>
            <td style="padding:10px; color:#555;">${item.materiaKey.toUpperCase()}</td>
            <td style="padding:10px; color:#555; text-align: justify; line-height: 1.5;">${htmlText}</td>
            <td style="padding:10px; text-align:center;">
                <button onclick="window.editarSemanario('${item.data}', '${item.materiaKey}', '${safeText}')" 
                        style="background-color: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; box-shadow: 0px 2px 0px #ffccbc; border-radius: 4px; padding: 4px 8px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.1s;"
                        onmousedown="this.style.boxShadow='0px 0px 0px #ffccbc'; this.style.transform='translateY(1px)'"

                    ✏️ Editar
                </button>
            </td>
        </tr>`;
    });
    html += `</table>`;
    container.innerHTML = html;
};



// Edição rápida pela tabela (Com Espião Integrado)
window.editarSemanario = function(dataKey, materiaKey, conteudoAtual) {
    let dataBR = dataKey.split('-').reverse().join('/');
    
    // Passo 1: Edição da Data
    let novaDataBR = prompt("1️⃣ Edite a DATA (DD/MM/AAAA) ou deixe EM BRANCO para apagar o registro:", dataBR);
    if (novaDataBR === null) return; 

    // Passo 2: Edição do Conteúdo
    let novoTexto = prompt("2️⃣ Edite o CONTEÚDO ou deixe EM BRANCO para apagar o registro:", conteudoAtual);
    if (novoTexto === null) return; 

    let contextoTurma = (typeof currentClassContext !== 'undefined') ? currentClassContext : null;
    if(!contextoTurma) return;

    let index = window.memoriaSemanario.findIndex(x => x.data === dataKey && x.materiaKey === materiaKey);
    
    // Identifica se a intenção foi apagar o registro
    let isExclusao = (novaDataBR.trim() === "" && novoTexto.trim() === "");

    if (isExclusao) {
        if (!confirm("⚠️ Você apagou a data e o conteúdo. Este registro será EXCLUÍDO. Confirma?")) return;
        if (index >= 0) window.memoriaSemanario.splice(index, 1);
    } else {
        // Lógica de Atualização da data
        let partesData = novaDataBR.split('/');
        let novaDataIso = dataKey; 
        if (partesData.length === 3) {
            novaDataIso = partesData[2] + '-' + partesData[1] + '-' + partesData[0];
        }

        if (index >= 0) {
            window.memoriaSemanario[index].conteudo = novoTexto;
            window.memoriaSemanario[index].data = novaDataIso;
        } else {
            window.memoriaSemanario.push({ data: novaDataIso, materiaKey: materiaKey, conteudo: novoTexto });
        }
    }

    if (typeof db !== 'undefined') {
        db.collection('classes').doc(contextoTurma).set({ semanarioConteudo: window.memoriaSemanario }, { merge: true })
        .then(() => {
            // ==========================================
            // O ESPIÃO REGISTRA A EDIÇÃO OU EXCLUSÃO
            // ==========================================
            try {
                let materiaNome = materiaKey.toUpperCase();
                if (isExclusao) {
                    registrarLog("EXCLUSÃO NO SEMANÁRIO", `Excluiu o planejamento de ${materiaNome} do dia ${dataBR} na turma ${contextoTurma}.`);
                } else {
                    let dataFinalLog = novaDataBR.trim() !== "" ? novaDataBR : dataBR;
                    registrarLog("EDIÇÃO NO SEMANÁRIO", `Editou o planejamento de ${materiaNome} para a data ${dataFinalLog} na turma ${contextoTurma}.`);
                }
            } catch(e) { console.error("Erro no espião do editor de semanário:", e); }

            alert("✅ Registro editado com sucesso!");
            window.renderWeekly(); // Atualiza a tela toda
        }).catch(e => alert("Erro ao editar: " + e));
    }
};

// 2. Função de edição (Agora editando Data e Conteúdo com Espião) 
window.abrirEditorConteudo = function(turma, dataIso, conteudoAtual) {
    let dataBR = dataIso.split('-').reverse().join('/');
    
    // Passo 1: Edição da Data
    let novaDataBR = prompt("1️⃣ Edite a DATA (DD/MM/AAAA) ou deixe EM BRANCO para apagar o registro:", dataBR);
    if (novaDataBR === null) return; 

    // Passo 2: Edição do Conteúdo
    let novoTexto = prompt("2️⃣ Edite o CONTEÚDO ou deixe EM BRANCO para apagar o registro:", conteudoAtual);
    if (novoTexto === null) return; 

    // MÁGICA DA EXCLUSÃO: Se apagou os dois, o sistema deleta a linha
    if (novaDataBR.trim() === "" && novoTexto.trim() === "") {
        if (!confirm("⚠️ Você apagou a data e o conteúdo. Este registro será EXCLUÍDO. Confirma?")) return;
        
        // CORREÇÃO AQUI: Normalizamos os textos (trocamos \n por espaço) para o computador comparar corretamente
        window.memoriaDiario = window.memoriaDiario.filter(x => {
            const conteudoNaMemoria = x.conteudo.replace(/\n/g, ' ');
            const conteudoBuscado = conteudoAtual.replace(/\n/g, ' ');
            return !(x.data === dataIso && conteudoNaMemoria === conteudoBuscado);
        });
        
        if (typeof db !== 'undefined' && turma) {
            db.collection('classes').doc(turma).set({ diarioConteudo: window.memoriaDiario }, { merge: true })
            .then(() => {
                // ==========================================
                // O ESPIÃO REGISTRA A EXCLUSÃO DO DIÁRIO
                // ==========================================
                registrarLog("EXCLUSÃO NO DIÁRIO", `Apagou o registro de aula do dia ${dataBR} na turma ${turma}.`);
                
                alert("✅ Registro excluído com sucesso!");
                window.renderGestaoConteudo();
            }).catch(err => alert("Erro ao excluir: " + err));
        }
        return;
    }

    // Lógica normal de Edição
    let partesData = novaDataBR.split('/');
    let novaDataIso = dataIso; 
    if (partesData.length === 3) {
        novaDataIso = partesData[2] + '-' + partesData[1] + '-' + partesData[0];
    }

    if (novaDataIso === dataIso && novoTexto === conteudoAtual) return; 

    // CORREÇÃO AQUI: Normalizamos a busca na edição também
    let registro = window.memoriaDiario.find(x => {
        const conteudoNaMemoria = x.conteudo.replace(/\n/g, ' ');
        const conteudoBuscado = conteudoAtual.replace(/\n/g, ' ');
        return x.data === dataIso && conteudoNaMemoria === conteudoBuscado;
    });

    if(registro) {
        registro.data = novaDataIso;
        registro.conteudo = novoTexto;
        
        if (typeof db !== 'undefined' && turma) {
            db.collection('classes').doc(turma).set({ diarioConteudo: window.memoriaDiario }, { merge: true })
            .then(() => {
                // ==========================================
                // O ESPIÃO REGISTRA A EDIÇÃO DO DIÁRIO
                // ==========================================
                registrarLog("EDIÇÃO NO DIÁRIO", `Alterou o registro de aula do dia ${dataBR} na turma ${turma}.`);

                alert("✅ Registro atualizado com sucesso!");
                window.renderGestaoConteudo();
            })
            .catch(err => alert("Erro ao salvar: " + err));
        }
    }
};

// FUNÇÕES DE GESTÃO DE FERIADOS E EXCEÇÕES (PAINEL DE CONFIGURAÇÕES)
// =========================================================================

window.adicionarNovaExcecao = function() {
    const dataInicio = document.getElementById('nova-exc-data').value;
    let dataFim = document.getElementById('nova-exc-data-fim').value;
    const motivoInput = document.getElementById('nova-exc-motivo').value.trim();

    // 1. Validação Básica
    if (!dataInicio || !motivoInput) return alert("⚠️ Por favor, preencha a data inicial e o motivo!");

    // 2. A MÁGICA: Se não tem data final, a data final vira a data inicial (Feriado de 1 dia)
    if (!dataFim) {
        dataFim = dataInicio;
    }

    // 3. Trava de segurança para datas invertidas
    if (dataFim < dataInicio) {
        return alert("⚠️ A data final não pode ser anterior à data inicial!");
    }

    const excecoes = window.loadExceptionOverrides();
    
    // Nova chave estruturada (ex: 2026-07-01_2026-07-31)
    const chavePeriodo = `${dataInicio}_${dataFim}`;
    excecoes[chavePeriodo] = { label: motivoInput, blocked: true };

    // ==========================================
    // 1. SALVAMENTO PROTEGIDO NO SISTEMA
    // ==========================================
    try {
        window.saveExceptionOverrides(excecoes);
    } catch(e) {
        console.error("Erro ao salvar exceção:", e);
        return alert('❌ Erro ao salvar o período no sistema: ' + (e.message || 'Erro desconhecido'));
    }

    // Função rápida para converter YYYY-MM-DD para DD/MM/YYYY no alerta e no log
    const formatarData = (dataStr) => dataStr.split('-').reverse().join('/');
    const dataInFormatada = formatarData(dataInicio);
    const dataFimFormatada = formatarData(dataFim);

    // ==========================================
    // 2. O ESPIÃO REGISTRA A INCLUSÃO DO FERIADO
    // ==========================================
    try {
        let detalhePeriodo = (dataInicio === dataFim) ? dataInFormatada : `de ${dataInFormatada} até ${dataFimFormatada}`;
        registrarLog("NOVO FERIADO/EXCEÇÃO", `Adicionou "${motivoInput}" para o período ${detalhePeriodo}.`);
    } catch(e) { console.error("Erro no espião de exceções:", e); }

    // ==========================================
    // 3. ALERTA DETALHADO E ESTILIZADO EM LISTA
    // ==========================================
    alert(`✅ Feriado/Exceção adicionado com sucesso!\n\nMotivo: ${motivoInput}\nData Início: ${dataInFormatada}\nData Final: ${dataFimFormatada}`);
    
    // Limpa os campos
    document.getElementById('nova-exc-data').value = "";
    document.getElementById('nova-exc-data-fim').value = "";
    document.getElementById('nova-exc-motivo').value = "";
    
    if(typeof window.renderListaExcecoes === 'function') window.renderListaExcecoes();

    // ==========================================
    // 4. MÁGICA CERTEIRA PARA MANTER A ABA ABERTA
    // ==========================================
    setTimeout(() => {
        const el = document.getElementById('nova-exc-data');
        if (el) {
            const abaConteudo = el.closest('.config-toggle-content') || el.closest('div[id*="content"]');
            if (abaConteudo) {
                abaConteudo.style.display = 'block';
                abaConteudo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }, 300);
};

    const excecoes = window.loadExceptionOverrides ? window.loadExceptionOverrides() : {};

        html += `
        <tr style="border-bottom: 1px solid #eee;">
            <td style="padding:10px; font-weight:bold; color:#444; width:110px;">${dataIniBR}</td>
            <td style="padding:10px; font-weight:bold; color:#444; width:110px;">${dataFimBR}</td>
            <td style="padding:10px;">
                <input type="text" id="edit-exc-${chave}" value="${info.label}" style="width:100%; border:none; outline:none; background:transparent; font-family:inherit; font-size:14px; border-bottom: 1px dashed #ccc;">
            </td>
            <td style="padding:10px; text-align:center; display:flex; gap:5px; justify-content:center;">
                <button onclick="window.salvarEdicaoExcecao('${chave}')" style="background:#f8fbff; color:#66b2ff; border:1px solid #d9ebff; border-radius:4px; padding:4px 8px; cursor:pointer;" title="Salvar Alteração">💾</button>
                <button onclick="window.excluirExcecao('${chave}')" style="background:#fffafa; color:#ff8080; border:1px solid #ffe0e0; border-radius:4px; padding:4px 8px; cursor:pointer;" title="Excluir Data">🗑️</button>
            </td>
        </tr>`;
    });
    html += `</table>`;
    
    // --- NOVO: BOTÃO DE IMPRESSÃO ---
    html += `
    <div style="margin-top: 15px; text-align: right;">
        <button class="main-button" 
            style="background-color: #f3e5f5 !important; color: #6a1b9a !important; border: 1px solid #e1bee7 !important; box-shadow: 0px 3px 0px #ce93d8 !important; border-radius: 6px !important; font-weight: bold; cursor: pointer; padding: 10px 20px; transition: all 0.1s;" 
            onclick="window.imprimirExcecoes()"
            onmousedown="this.style.boxShadow='0px 1px 0px #ce93d8'; this.style.transform='translateY(2px)'"
            onmouseup="this.style.boxShadow='0px 3px 0px #ce93d8'; this.style.transform='translateY(0)'"
            onmouseleave="this.style.boxShadow='0px 3px 0px #ce93d8'; this.style.transform='translateY(0)'">
            🖨️ Imprimir Calendário
        </button>
    </div>`;

    container.innerHTML = html;
};



window.imprimirExcecoes = function() {
    const excecoes = window.loadExceptionOverrides ? window.loadExceptionOverrides() : {};
    const chaves = Object.keys(excecoes).sort();

    if (chaves.length === 0) return alert("Não há feriados ou exceções cadastradas para imprimir.");

    // Monta as linhas da tabela de impressão (AGORA ALINHADAS À ESQUERDA)
    let linhasHtml = '';
    chaves.forEach(chave => {
        const info = excecoes[chave];
        let dataIniISO, dataFimISO;
        if (chave.includes('_')) {
            [dataIniISO, dataFimISO] = chave.split('_');
        } else {
            dataIniISO = chave; dataFimISO = chave;
        }
        const dataIniBR = dataIniISO.split('-').reverse().join('/');
        const dataFimBR = dataFimISO.split('-').reverse().join('/');

        linhasHtml += `
            <tr style="border-bottom: 1px solid #ccc;">
                <td style="padding: 10px; border-right: 1px solid #ccc; text-align: left; font-weight: bold;">${dataIniBR}</td>
                <td style="padding: 10px; border-right: 1px solid #ccc; text-align: left; font-weight: bold;">${dataFimBR}</td>
                <td style="padding: 10px; text-align: left;">${info.label}</td>
            </tr>
        `;
    });

    // Pega o ano atual para o cabeçalho
    const anoAtual = new Date().getFullYear();

    // Documento final no padrão oficial
    const documentoFinal = `
        <div style="page-break-inside: avoid; break-inside: avoid; color: #333;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
                <div><img src="LOGO GP.png" alt="Logo GP" class="logo-icone" style="max-height:60px;"></div>
                <div style="text-align:right;">
                    <h1 style="margin: 0; font-size: 1.2em; text-transform: uppercase;">CALENDÁRIO DE FERIADOS E EXCEÇÕES</h1>
                    <h3 style="margin: 5px 0 0 0; font-weight: 400; color: #555;">Colégio GP - ${anoAtual}</h3>
                </div>
            </div>
            
            <table style="width: 100%; border-collapse: collapse; font-family: 'Poppins', sans-serif; font-size: 14px; border: 1px solid #ccc;">
                <thead>
                    <tr style="background-color: #f1f1f1; border-bottom: 2px solid #aaa;">
                        <th style="padding: 12px 10px; border-right: 1px solid #ccc; width: 15%; text-align: left;">Data Inicial</th>
                        <th style="padding: 12px 10px; border-right: 1px solid #ccc; width: 15%; text-align: left;">Data Final</th>
                        <th style="padding: 12px 10px; width: 70%; text-align: left;">Motivo / Feriado</th>
                    </tr>
                </thead>
                <tbody>
                    ${linhasHtml}
                </tbody>
            </table>
        </div>
    `;

    // Aciona o seu modal blindado de impressão
    const modal = document.getElementById('print-modal');		
    const cssImpressao = `
        <style>
            @media print {
                body > *:not(#print-modal) { display: none !important; }
                body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
                #print-modal { position: static !important; display: block !important; background: transparent !important; }
                .modal-content { height: auto !important; max-height: none !important; margin: 0 !important; border: none !important; box-shadow: none !important; width: 100% !important; max-width: 100% !important; padding: 0 !important; }
                #content-to-save { overflow: visible !important; height: auto !important; flex: none !important; min-height: 100% !important; display: block !important; }
                .no-print, .mask-black { display: none !important; }
            }
        </style>
    `;

    modal.innerHTML = `
        ${cssImpressao}
        <div class="no-print mask-black" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9998;"></div>
        <div class="modal-content" style="position:relative; z-index:9999; max-width: 800px; width: 95%; max-height: 95vh; height: 95vh; margin: 2vh auto; background: #fff; border-radius: 8px; display:flex; flex-direction: column; padding: 20px; box-sizing: border-box;">
            
            <div class="no-print" style="background:#fff3cd; color:#856404; padding:10px; text-align:center; font-size:14px; border-radius:4px; margin-bottom:15px; border: 1px solid #ffeeba;">
                <b>✏️ MODO DE EDIÇÃO ATIVO:</b> Se precisar adicionar um detalhe pontual antes da impressão, clique no texto abaixo. (Essa edição não salva no banco).
            </div>

            <div id="content-to-save" class="roteiro-print" contenteditable="true" style="text-align: left; flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; padding-right: 10px; outline: none;">
                ${documentoFinal}
            </div>
            
            <div class="no-print" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; flex-shrink: 0;">
                <button class="btn-preview-fixed" style="flex: 1; background: #f3e5f5 !important; color: #6a1b9a !important; border: 1px solid #e1bee7 !important; border-radius: 4px; padding: 10px; cursor: pointer; font-weight: bold;" onclick="document.getElementById('print-modal').style.display = 'none'">❌ FECHAR JANELA</button>
                <button class="btn-preview-fixed" style="flex: 1; background: #f3e5f5 !important; color: #6a1b9a !important; border: 1px solid #e1bee7 !important; border-radius: 4px; padding: 10px; cursor: pointer; font-weight: bold;" onclick="window.print()">🖨️ IMPRIMIR / SALVAR PDF</button>
            </div>
        </div>
    `;
    modal.style.display = 'block';
};



// =========================================================================
// FUNÇÕES COMPLEMENTARES DE AÇÃO (SALVAR EDIÇÃO E EXCLUIR)
// =========================================================================

window.salvarEdicaoExcecao = function(chave) {
    const novoMotivo = document.getElementById(`edit-exc-${chave}`).value.trim();
    if (!novoMotivo) return alert("⚠️ O motivo não pode ficar vazio!");

    const excecoes = window.loadExceptionOverrides();
    if (!excecoes[chave]) return; // Trava de segurança caso não encontre

    const motivoAntigo = excecoes[chave].label || "Sem motivo anterior";

    // Extrai as datas da chave (que está no formato YYYY-MM-DD_YYYY-MM-DD)
    const partesChave = chave.split('_');
    const dataInicio = partesChave[0] || chave;
    const dataFim = partesChave[1] || dataInicio;

    // Função rápida para formatar de YYYY-MM-DD para DD/MM/YYYY
    const formatarData = (dataStr) => dataStr.split('-').reverse().join('/');
    const dataInFormatada = formatarData(dataInicio);
    const dataFimFormatada = formatarData(dataFim);
    const detalhePeriodo = (dataInicio === dataFim) ? dataInFormatada : `${dataInFormatada} a ${dataFimFormatada}`;

    // Atualiza no objeto local
    excecoes[chave].label = novoMotivo;

    // ==========================================
    // 1. SALVAMENTO PROTEGIDO NO SISTEMA
    // ==========================================
    try {
        window.saveExceptionOverrides(excecoes);
    } catch(e) {
        console.error("Erro ao editar exceção:", e);
        return alert('❌ Erro ao salvar a edição no sistema: ' + (e.message || 'Erro desconhecido'));
    }

    // ==========================================
    // 2. O ESPIÃO REGISTRA A EDIÇÃO DO FERIADO
    // ==========================================
    try {
        if (motivoAntigo !== novoMotivo) {
            registrarLog("EDIÇÃO DE FERIADO", `Alterou o motivo do período (${detalhePeriodo}) de "${motivoAntigo}" para "${novoMotivo}".`);
        }
    } catch(e) { console.error("Erro no espião de edição de exceções:", e); }

    // ==========================================
    // 3. ALERTA DETALHADO E ESTILIZADO EM LISTA
    // ==========================================
    alert(`✅ Motivo atualizado com sucesso!\n\nPeríodo: ${detalhePeriodo}\nMotivo Antigo: ${motivoAntigo}\nNovo Motivo: ${novoMotivo}`);
    
    // Atualiza a interface para mostrar o novo nome imediatamente
    if(typeof window.renderListaExcecoes === 'function') window.renderListaExcecoes();

    // ==========================================
    // 4. MÁGICA CERTEIRA PARA MANTER A ABA ABERTA
    // ==========================================
    setTimeout(() => {
        // Tenta achar o elemento de edição ou usa o input principal de datas como âncora
        const el = document.getElementById(`edit-exc-${chave}`) || document.getElementById('nova-exc-data');
        if (el) {
            const abaConteudo = el.closest('.config-toggle-content') || el.closest('div[id*="content"]');
            if (abaConteudo) {
                abaConteudo.style.display = 'block';
                abaConteudo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }, 300);
};

// =========================================================================
// FUNÇÕES DE EXCLUSÃO DE FERIADOS E EXCEÇÕES
// =========================================================================

window.excluirExcecao = function(chave) {
    const excecoes = window.loadExceptionOverrides();
    const excecaoParaApagar = excecoes[chave];
    
    // Se por acaso a chave não existir, interrompe
    if (!excecaoParaApagar) return;

    const motivo = excecaoParaApagar.label || "Feriado/Exceção";

    if (!confirm(`🗑️ Tem certeza que deseja excluir a exceção "${motivo}" do calendário?`)) return;

    // Extrai as datas da chave (que está no formato YYYY-MM-DD_YYYY-MM-DD)
    const partesChave = chave.split('_');
    const dataInicio = partesChave[0] || chave;
    const dataFim = partesChave[1] || dataInicio;

    // Função rápida para formatar de YYYY-MM-DD para DD/MM/YYYY
    const formatarData = (dataStr) => dataStr.split('-').reverse().join('/');
    const dataInFormatada = formatarData(dataInicio);
    const dataFimFormatada = formatarData(dataFim);

    // Remove do objeto local
    delete excecoes[chave];

    // ==========================================
    // 1. SALVAMENTO PROTEGIDO NO SISTEMA
    // ==========================================
    try {
        window.saveExceptionOverrides(excecoes);
    } catch(e) {
        console.error("Erro ao excluir exceção:", e);
        return alert('❌ Erro ao salvar a exclusão no sistema: ' + (e.message || 'Erro desconhecido'));
    }

    // ==========================================
    // 2. O ESPIÃO REGISTRA A EXCLUSÃO
    // ==========================================
    try {
        let detalhePeriodo = (dataInicio === dataFim) ? dataInFormatada : `de ${dataInFormatada} até ${dataFimFormatada}`;
        registrarLog("EXCLUSÃO DE FERIADO/EXCELÇÃO", `Removeu do calendário: "${motivo}" (${detalhePeriodo}).`);
    } catch(e) { console.error("Erro no espião de exclusão de exceções:", e); }

    // ==========================================
    // 3. ALERTA DETALHADO E ESTILIZADO EM LISTA
    // ==========================================
    alert(`✅ Feriado/Exceção excluído com sucesso!\n\nMotivo: ${motivo}\nData Início: ${dataInFormatada}\nData Final: ${dataFimFormatada}`);
    
    if(typeof window.renderListaExcecoes === 'function') window.renderListaExcecoes();

    // ==========================================
    // 4. MÁGICA CERTEIRA PARA MANTER A ABA ABERTA
    // ==========================================
    setTimeout(() => {
        // Usa o input de nova exceção como âncora para encontrar a aba de calendário
        const el = document.getElementById('nova-exc-data');
        if (el) {
            const abaConteudo = el.closest('.config-toggle-content') || el.closest('div[id*="content"]');
            if (abaConteudo) {
                abaConteudo.style.display = 'block';
                abaConteudo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }, 300);
};


</script>
