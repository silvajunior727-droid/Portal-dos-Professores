/* =================================================================================
   1️⃣ CONFIGURAÇÃO DA AGENDA (Procure este bloco no início do seu código)
   ================================================================================= */   			  
var agendaAulas = {
    "portugues": [1, 2, 3, 4, 5],       // Liberado de Segunda a Sexta
    "matematica": [1, 2, 3, 4, 5],      // Liberado de Segunda a Sexta
    "ciencias": [1, 2, 3, 4, 5],        // Liberado de Segunda a Sexta
    "geografia": [1, 2, 3, 4, 5],       // Liberado de Segunda a Sexta
    "edfisica": [1, 2, 3, 4, 5],        // Liberado de Segunda a Sexta (Ajustado para bater com o seletor)
    "historia": [1, 2, 3, 4, 5],        // Liberado de Segunda a Sexta
    "ingles": [1, 2, 3, 4, 5],          // Liberado de Segunda a Sexta
    "arte": [1, 2, 3, 4, 5]             // Liberado de Segunda a Sexta
};

// =========================================================
// LER USUÁRIOS DO FIREBASE AO ABRIR O PORTAL
// =========================================================
function carregarUsuariosDoFirebase() {
    // console.log("🔄 Buscando lista oficial de usuários no Firebase...");

    // Vai na coleção 'sistema', no documento 'usuarios'
    db.collection("sistema").doc("usuarios").get()
    .then((doc) => {
        if (doc.exists) {
            // 1. Se a gaveta existe, a gente pega os dados da nuvem e SOBRESCREVE a memória!
            users = doc.data();
            // console.log("☁️ ✅ Lista oficial de usuários carregada com sucesso!");
            
            // 2. Já guardamos no computador também por segurança
            localStorage.setItem('gp_v9_users', JSON.stringify(users));
        } else {
            // Se a gaveta não existir (primeira vez que o portal roda com esse código novo)
            // console.log("ℹ️ Nenhuma lista na nuvem ainda. Usando a lista do código fonte.");
            
            // Já aproveita o embalo e cria a gaveta no Firebase com a sua lista atual!
            salvarUsuariosNoFirebase();
        }
    })
    .catch((error) => {
        console.error("❌ Erro ao tentar ler o Firebase:", error);
        // console.log("⚠️ Usando a lista do código como plano B.");
    });
}

// Essa linha mágica faz a função rodar SOZINHA assim que a tela do portal terminar de carregar
window.addEventListener('load', carregarUsuariosDoFirebase);


// =========================================================
// BLOCO: 2. DIÁRIO - VALIDAÇÃO E SALVAMENTO (AJUSTADO)
// =========================================================

// 2. Função única de validação (Agora apenas Alerta, sem travar o campo)
function validarDiaAula() {
    const campoData = document.getElementById('data-aula');
    const campoMateria = document.getElementById('selMateriaChamada');
    
    if (!campoData.value || !campoMateria.value) return;

    const dataSelecionada = new Date(campoData.value + "T12:00:00");
    const diaSemana = dataSelecionada.getDay();
    const materia = campoMateria.value.toLowerCase(); 

    if (agendaAulas[materia]) {
        if (!agendaAulas[materia].includes(diaSemana)) {
            // ALERTA MANTIDO, MAS A DATA NÃO É MAIS LIMPA (campoData.value = "" removido)
            alert("⚠️ Atenção: Não há aula desta matéria neste dia da semana! O registro será feito, mas fique atento.");
        }
    }
}


// 3. Aplica a validação nos campos SOMENTE após a página estar 100% carregada
document.addEventListener('DOMContentLoaded', function() {
    const campoData = document.getElementById('data-aula');
    const campoMateria = document.getElementById('selMateriaChamada');
    
    // Adicionamos uma trava de segurança para evitar erro caso o botão não exista na tela
    if (campoData) campoData.addEventListener('change', validarDiaAula);
    if (campoMateria) campoMateria.addEventListener('change', validarDiaAula);
});
										

</script>

/* =========================================================

/* --- MODERNIZAÇÃO DOS BOTÕES (COM VARIÁVEIS) --- */
button, .main-button, .header-btn, .btn-square, .notice-close-btn, .btn-3d-text{
  border: none; outline: none;
  font-family: 'Poppins', sans-serif; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
  cursor: pointer; position: relative;
  transition: all 0.12s ease;

  /* Forma e texto */
  border-radius: var(--local-radius, var(--btn-radius)) !important;
  color: var(--local-color, #fff) !important;

  /* Base visual (cor + 3D) controlada por variáveis.
     - Se você NÃO definir tema, cai no azul padrão.
     - As classes antigas (save-button, btn-blue...) vão setar isso lá embaixo. */
  background-color: var(--local-bg, #3498db) !important;
  box-shadow: 0 var(--local-shadow-y, var(--btn-shadow-y)) 0 var(--local-shadow-color, #2980b9) !important;

  margin-bottom: 6px;
  transform: translateY(0);
  display: inline-flex; align-items: center; justify-content: center;

  /* Tamanho padrão unificado */
  min-height: var(--local-h, var(--btn-h));
  font-size: var(--local-font, var(--btn-font));
}

/* main-button */
/* Overrides manuais por botão (via style="--local-*") */
.main-button{
  height: var(--local-h, auto);
  min-height: var(--local-minh, 0px);

  font-size: var(--local-font, 14px);

  padding: var(--local-pad-y, 10px) var(--local-pad-x, 20px);

  /* opcional: controlar a "largura mínima" do botão */
  min-width: var(--local-minw, auto);
}

/* header-btn */
.header-btn{
  padding: var(--local-pad-y, var(--btn-pad-y)) var(--local-pad-x, var(--btn-pad-x));
  font-size: var(--local-font, 0.9em); /* mantém sua intenção original */
  gap: 8px;
}

/* Botão “texto 3D” (flex:1) */
.btn-3d-text{
  padding: calc(var(--local-pad-y, var(--btn-pad-y)) - 2px)
           calc(var(--local-pad-x, var(--btn-pad-x)) - 5px);
  font-size: var(--local-font, 0.85em);
  flex: 1;
}

/* Quadradinhos (X, +, etc.) */
.btn-square{
  width: var(--local-square, var(--btn-square)) !important;
  height: var(--local-square, var(--btn-square)) !important;
  padding: 0 !important;
  min-height: unset; /* evita briga com --btn-h */
}

/* Efeito de “apertar” */
button:active, .main-button:active, .header-btn:active,
.btn-square:active, .notice-close-btn:active, .btn-3d-text:active{
  transform: translateY(var(--btn-press-y)) !important;
  box-shadow: 0 0 0 rgba(0,0,0,0) !important;
}

/* =====================================================

===================================================== */
@media print {
    /* 1. Configura a folha */
    @page { size: landscape; margin: 10mm; }

    /* 2. Esconde TUDO, exceto o Calendário, o Modal e a Gestão de Conteúdo */
    body > *:not(#telaCalendarioAnual):not(#print-modal):not(#gestao-conteudo) {
        display: none !important;
    }

    /* 3. Libera o Calendário */
    #telaCalendarioAnual {
        display: block !important;
        visibility: visible !important;
        position: relative !important;
        width: 100% !important;
        height: auto !important;
    }
    #telaCalendarioAnual * { visibility: visible !important; }

    /* 4. Organiza os meses em colunas */
    .calendar-grid-annual {
        display: grid !important;
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 5px !important;
    }

    /* 5 e 7. Força a quebra de página */
    .grupo-1 { 
        page-break-after: always !important; 
        margin-bottom: 20px;
    }

    /* 6. Esconde botões na hora de imprimir (incluindo o botão Editar) */
    .no-print, .header-right, .year-selector button, .btn-back, button {
        display: none !important;
    }

    /* 8. Faz as cores aparecerem */
    #calendar-legend { display: block !important; }

    /* 9. FORÇA A TABELA DE GESTÃO A CABER NO PAPEL */
    #gestao-conteudo { display: block !important; visibility: visible !important; width: 100% !important; }
    #gestao-conteudo table { 
        width: 100% !important; 
        table-layout: fixed !important; 
        border-collapse: collapse !important;
    }
    #gestao-conteudo td { 
        word-wrap: break-word !important; 
        white-space: pre-wrap !important; 
        border: 1px solid #ccc !important;
        padding: 5px !important;
        font-size: 11px !important;
    }
} 

/* Fora do media print: Ajustes de cor globais */

}

function getFaltas(aluno, materia) {
    if (!aluno || !aluno.diary) return 0;
    
    // Nome do campo do boletim (ex: faltas_matematica)
    const nomeCampo = (materia === "ingles" ? "faltasingles" : (materia === "edfisica" ? "faltasedfisica" : "faltas_" + materia));
    let totalBoletim = 0;

    // Percorre todos os dias registrados
    for (let dataKey in aluno.diary) {
        let entry = aluno.diary[dataKey];
        
        // Verifica se o registro é válido
        if (typeof entry === 'object' && entry !== null) {
            
            // 1. O Boletim sempre deve ler o campo específico da matéria
            // 2. MAS, se o campo "just" estiver preenchido, o aluno tem direito a zero faltas naquele dia (justificado)
            let temJustificativa = entry.just && String(entry.just).trim() !== "" && entry.just !== "Aguarde..."; 
            
            if (temJustificativa) {
                // Se tem justificativa, esse dia NÃO entra na conta do boletim (vale 0)
                continue; 
            } else {
                // Se NÃO tem justificativa, lemos o valor gravado na matéria
                // Se o campo da matéria não existir, lemos o valor geral de faltas
                let valorDoDia = (entry[nomeCampo] !== undefined) ? entry[nomeCampo] : (entry.faltas || 0);
                totalBoletim += Number(valorDoDia);
            }
        }
    }
    return totalBoletim;
}


function totalFaltasGeral(aluno) {
    let soma = 0;
    SUBJECTS.forEach(materia => soma += getFaltas(aluno, materia)); 
    return soma;
}


function normalizarMateria(m) {
  if (m === null || m === undefined || m === "") return "NÃO INFORMADO";
  // se vier "0" ou 0, tenta mapear em SUBJECTS
  const n = Number(m);
  if (!isNaN(n) && String(m).trim() !== "" && Array.isArray(SUBJECTS) && SUBJECTS[n]) return SUBJECTS[n];
  return String(m).toUpperCase();
}

  if (p === null || p === undefined || String(p).trim() === "" || String(p).toLowerCase() === "null") {
    if (window.currentUser && currentUser.displayName) return String(currentUser.displayName).toUpperCase();         
    return "PROFESSOR(A)";
  }
  return String(p).toUpperCase();
}

        saveExceptionOverrides(INITIAL_EXCEPTIONS);
        return INITIAL_EXCEPTIONS;
    }
    return JSON.parse(saved);
  } catch (e) {

// 4) Banco final de exceções (Agora lê exclusivamente da memória dinâmica)
function getExceptionInfo(dateIso) {
  const exceptions = loadExceptionOverrides();

  if (exceptions[dateIso]) return exceptions[dateIso];

  // Fim de semana (Continua sendo bloqueio/alerta automático)
  const d = new Date(`${dateIso}T12:00:00`);
  const day = d.getDay();
  if (day === 0 || day === 6) return { label: "Fim de semana", blocked: true };

  return null; 
}

function getWeekendIsoDates(year) {
  const out = [];
  let d = new Date(`${year}-01-01T12:00:00`);
  const end = new Date(`${year}-12-31T12:00:00`);
  while (d <= end) {
    const day = d.getDay(); 
    if (day === 0 || day === 6) out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

// 5) Função de checagem
function isClassDateBlocked(dateIso) {
  const info = getExceptionInfo(dateIso);
  return info ? !!info.blocked : false;
}

  const info = getExceptionInfo(dateIso);
  const motivo = info?.label ? `Motivo: ${info.label}` : "Motivo: data não letiva";
  
// 1. Dividimos a data ISO (ex: "2026-01-05") em três partes usando o traço
  const [ano, mes, dia] = dateIso.split('-');

  // 2. Troquei o 'alert' simples por um 'confirm'. Assim, se o professor clicar em "OK", o sistema devolve 'true' e pode prosseguir.
  return confirm(`⚠️ ATENÇÃO: Você está tentando usar o ${actionLabel} em uma data com EXCEÇÃO!\n\n📅 Data: ${dia}/${mes}/${ano}\n📌 ${motivo}\n\nVocê tem autonomia para continuar. Deseja registrar a aula mesmo assim?`);
}

function guardBlockedDateOrReturn(dateIso, actionLabel) {
  // Se não vier data, deixa a função seguir (não quebra fluxos antigos)
  if (!dateIso) return false;

  // Se as funções-base ainda não existirem, também não bloqueia (fail-safe)
  if (typeof isClassDateBlocked !== "function") return false;

  if (isClassDateBlocked(dateIso)) {
    if (typeof alertBlockedDate === "function") alertBlockedDate(dateIso, actionLabel);
    else alert(`🚫 Ação bloqueada (${actionLabel}). Data: ${dateIso}`);
    return true; // BLOQUEOU
  }
  return false; // LIBEROU
}

// Mostra a tela de bloqueio e GRAVA O CRACHÁ NA MEMÓRIA
window.acionarBloqueio = function(crachaForcado = "") {
    const lockScreen = document.getElementById('auto-lock-screen');
    const lockUser = document.getElementById('lock-username');
    
    let identificador = crachaForcado;
    let nomeDisplay = "Professor(a)";

    // Pega o nome do usuário para mostrar na tela e para salvar no crachá
    if (typeof currentUser !== 'undefined' && currentUser) {
        nomeDisplay = currentUser.displayName || "Professor(a)";
        if (!identificador) {
            // Tenta achar e-mail. Se não achar, usa o próprio Nome como crachá!
            identificador = currentUser.email || currentUser.login || currentUser.usuario || currentUser.displayName || "desconhecido";
        }
    }

    // 🔒 SALVA O CADEADO E O CRACHÁ NA MEMÓRIA!
    sessionStorage.setItem('gp_tela_bloqueada', 'true');
    sessionStorage.setItem('gp_cracha_bloqueado', identificador.toLowerCase());

    if (lockUser) {
        lockUser.innerText = nomeDisplay.split(' - ')[0]; 
    }

    if (lockScreen) lockScreen.style.display = 'flex';
    
    const passInput = document.getElementById('lock-password');

// A função que processa a senha (No seu sistema local)
window.tentarDesbloqueio = function() {
    const passwordInput = document.getElementById('lock-password').value.trim();
    const errorText = document.getElementById('lock-error');
    
    if (!passwordInput) {
        errorText.innerText = "Digite a senha!";
        errorText.style.display = 'block';
        return;
    }

    try {
        let destravou = false;

        if (typeof currentUser !== 'undefined' && currentUser) {
            if (currentUser.senha === passwordInput || currentUser.password === passwordInput) destravou = true;
        }

        if (!destravou && typeof users === 'object' && users !== null) {
            for (let login in users) {
                let u = users[login];
                if (u.displayName === currentUser.displayName && (u.senha === passwordInput || u.password === passwordInput)) {
                    destravou = true;
                    break;
                }
            }
        }

        if (!destravou) {
            let localData = localStorage.getItem('gp_v9_users');
            if (localData) {
                let localUsers = JSON.parse(localData);
                for (let login in localUsers) {
                    let u = localUsers[login];
                    if (u.displayName === currentUser.displayName && (u.senha === passwordInput || u.password === passwordInput)) {
                        destravou = true;
                        break;
                    }
                }
            }
        }

        if (destravou) {
            // 🔓 SENHA CORRETA! Limpa tudo da memória
            sessionStorage.removeItem('gp_tela_bloqueada');
            sessionStorage.removeItem('gp_cracha_bloqueado');
            
            document.getElementById('auto-lock-screen').style.display = 'none';
            registrarMovimento(); 
        } else {
            errorText.innerText = "Senha incorreta!";
            errorText.style.display = 'block';
        }
            
    } catch (erroCritico) {
        errorText.innerText = "Bug Detectado: " + erroCritico.message;
        errorText.style.display = 'block';
    }
}

// --- ESSA É A FUNÇÃO QUE LÊ AS MENSAGENS E MOSTRA NO MURAL (COM EXCLUIR) ---
function carregarObservacoes(nomeDoAluno) {
  const listaNoMural = document.getElementById("mural-lista");
  const bimestreAtual = document.getElementById("rep-bimestre").value;

  if (!listaNoMural) return;
  if (!nomeDoAluno) {
    listaNoMural.innerHTML = `<p style="text-align:center; color:#999; padding:10px;">Selecione um aluno.</p>`;
    return;
  }

  listaNoMural.innerHTML = `<p style="text-align:center; color:#666;">Buscando notas do ${bimestreAtual}...</p>`;

  db.collection("observacoes")
    .where("aluno", "==", nomeDoAluno)
    .where("bimestre", "==", bimestreAtual)
    .get()
    .then((resultado) => {
      listaNoMural.innerHTML = "";

      if (resultado.empty) {
        listaNoMural.innerHTML = `<p style="text-align:center; color:#999; padding:10px;">Nenhuma nota para o ${bimestreAtual}.</p>`;
        return;
      }

      let observacoes = [];
      resultado.forEach((doc) => {
        const d = doc.data();
        observacoes.push({
          id: doc.id,            // <- CHAVE para excluir
          ...d
        });
      });

      // mais recente primeiro (se existir timestamp do Firestore)
      observacoes.sort((a, b) => {
        const ta = a.data?.seconds ? a.data.seconds : 0;
        const tb = b.data?.seconds ? b.data.seconds : 0;
        return tb - ta;
      });

      observacoes.forEach((info) => {
        const dataBonita = info.data?.toDate ? info.data.toDate().toLocaleDateString("pt-BR") : "";
        const prof = info.professor || "Professor(a)";
        const txt = (info.texto || "").toString();

        listaNoMural.innerHTML += `
          <div style="background:#e3f2fd; padding:10px; border-radius:8px; margin-bottom:8px; border-left:5px solid #2196f3;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
              <small><strong>${prof}</strong>${dataBonita ? " em " + dataBonita : ""}</small>
              <button
                class="main-button btn-del"
                style="--local-h:34px; --local-font:11px; --local-pad-y:6px; --local-pad-x:10px; --local-shadow-y:3px; min-width:110px;"
                onclick="excluirObservacao('${info.id}', '${nomeDoAluno}')"
              >EXCLUIR</button>
            </div>
            <div style="margin-top:6px; font-size:0.95em;">${txt.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>
          </div>
        `;
      });
    })
    .catch((err) => {
      console.error("Erro ao carregar observações:", err);
      listaNoMural.innerHTML = `<p style="text-align:center; color:#dc3545; padding:10px;">Erro ao buscar observações. Verifique a conexão/permissão.</p>`;
    });
}


function excluirObservacao(docId, nomeDoAluno) {
  const bimestreAtual = document.getElementById("rep-bimestre").value;

  if (!docId) return alert("ID do registro não encontrado.");
  if (!confirm(`Deseja excluir este registro do ${bimestreAtual}?`)) return;

  db.collection("observacoes").doc(docId).delete()
    .then(() => {
      alert("Registro excluído com sucesso!");
      carregarObservacoes(nomeDoAluno);
    })
    .catch((err) => {
      console.error("Erro ao excluir:", err);
      alert("Erro ao excluir. Verifique permissões do Firebase.");
    });
}


async function excluirObservacoesDoBimestreAtual() {
  const aluno = document.getElementById("rep-aluno")?.value;
  const bimestreAtual = document.getElementById("rep-bimestre")?.value;

  if (!aluno) return alert("Selecione um aluno primeiro.");
  if (!bimestreAtual) return alert("Selecione o bimestre primeiro.");

  const ok = confirm(`ATENÇÃO!\nIsso vai excluir TODAS as observações do ${bimestreAtual} para:\n${aluno}\n\nDeseja continuar?`);
  if (!ok) return;

  try {
    const snap = await db.collection("observacoes")
      .where("aluno", "==", aluno)
      .where("bimestre", "==", bimestreAtual)
      .get();

    if (snap.empty) {
      alert(`Não há observações para excluir no ${bimestreAtual}.`);
      return;
    }

    // Firestore batch limita ~500 operações; vamos proteger
    if (snap.size > 450) {
      alert(`Foram encontradas ${snap.size} observações.\nPor segurança, exclua em partes (o limite do lote é ~500).`);
      return;
    }

    const batch = db.batch();
    snap.docs.forEach(doc => batch.delete(doc.ref));
    await batch.commit();

    alert(`Pronto! Excluídas ${snap.size} observações do ${bimestreAtual}.`);

    // Atualiza o mural
    carregarObservacoes(aluno);
  } catch (err) {
    console.error("Erro no lote de exclusão:", err);
    alert("Erro ao excluir em lote. Verifique permissões/regras do Firebase."); 
  }
}

function plusSlides(n) {
    const slides = document.querySelectorAll('#home-slideshow .slide');
    if(slides.length === 0) return;
    
    let current = 0;
    slides.forEach((s, i) => { 
        if(s.classList.contains('active')) current = i; 
        s.classList.remove('active');
        s.style.display = 'none'; // Esconde todas as fotos de forma garantida
    });
    
    let next = current + n;
    if(next >= slides.length) next = 0;
    if(next < 0) next = slides.length - 1;
    
    slides[next].classList.add('active');
    slides[next].style.display = 'block'; // Mostra a foto atualizada instantaneamente
}
        
function checkAndShowNotice() {
  if (!config.notice || !config.notice.active || !config.notice.text) return;

  // Identifica o aviso atual (se não tiver id, cai num "default")
  const noticeId = String(config.notice.id || "default");

  // Limite de vezes (0 = infinito)
  const maxViews = parseInt(config.notice.maxViews ?? 1, 10);
  const unlimited = (maxViews === 0);

  // Tempo em segundos (0 = manual). Aqui o tempo vira "validade máxima".
  const timeSec = parseInt(config.notice.time, 10) || 0;

  // Chaves por usuário (pra 1 professor não gastar o outro)
  const userKey =
    (currentUser && (currentUser.email || currentUser.displayName))
      ? String(currentUser.email || currentUser.displayName)
      : "anon";

  const viewsStoreKey = `gpv9noticeviews_${userKey}`;
  const timeStoreKey  = `gpv9noticetime_${userKey}`;

  // Lê mapa de views
  let viewsMap = {};
  try { viewsMap = JSON.parse(localStorage.getItem(viewsStoreKey)) || {}; } catch (e) {}

  // Lê mapa de tempo (primeira vez que viu)
  let timeMap = {};
  try { timeMap = JSON.parse(localStorage.getItem(timeStoreKey)) || {}; } catch (e) {}

  const currentViews = parseInt(viewsMap[noticeId] ?? 0, 10);

  // --- REGRA DO TEMPO (tempo manda nas vezes) ---
  // Se timeSec > 0: a partir da PRIMEIRA exibição, conta prazo.
  if (timeSec > 0 && timeMap[noticeId]) {
    const firstShownAt = parseInt(timeMap[noticeId], 10);
    const now = Date.now();
    if (now - firstShownAt >= timeSec * 1000) {
      // Tempo expirou: não mostra mais, mesmo que ainda tenha views sobrando
      if (typeof renderTicker === "function") renderTicker();
      return;
    }
  }

  // --- REGRA DAS VEZES ---
  if (!unlimited && currentViews >= maxViews) {
    if (typeof renderTicker === "function") renderTicker();
    return;
  }

  // Mostra o modal
  const modal = document.getElementById("notice-modal");
  const box = document.getElementById("notice-content-box");
  document.getElementById("notice-text").innerText = config.notice.text;
  box.style.background = config.notice.color;
  modal.style.display = "flex";

  // Se for a primeira vez desse aviso, registra o início do prazo
  if (timeSec > 0 && !timeMap[noticeId]) {
    timeMap[noticeId] = Date.now();
    localStorage.setItem(timeStoreKey, JSON.stringify(timeMap));
  }

  // Incrementa contador somente se não for infinito
  if (!unlimited) {
    viewsMap[noticeId] = currentViews + 1;
    localStorage.setItem(viewsStoreKey, JSON.stringify(viewsMap));
  }

  // Se você ainda quiser o auto-fechar visual (opcional), pode manter:
  // (Isso NÃO é a regra de validade; é só pra fechar sozinho na tela.)
  if (timeSec > 0) {
    setTimeout(closeNotice, timeSec * 1000);
  }
}

function toggleConfig(id) {
  const element = document.getElementById(id);
  const header = document.getElementById(id + '-header');

  // Segurança: se não achou o conteúdo, não faz nada (evita crash)
  if (!element) return;

  // Se o header não existir, ainda abre/fecha o conteúdo sem tentar mexer em texto
  if (!header) {
    element.style.display = (element.style.display === 'block') ? 'none' : 'block';

    // Se acabou de abrir a seção "Exceções", renderiza a lista na hora
    if (element.style.display === 'block' && id === "exceptions-content" && typeof renderExceptionsList === "function") {
      renderExceptionsList();
    }
    return;
  }

  if (element.style.display === 'block') {
    element.style.display = 'none';
    header.innerHTML = header.innerText.replace('▼', '▶');
  } else {
    document.querySelectorAll('.config-toggle-content').forEach(el => { el.style.display = 'none'; });
    document.querySelectorAll('.config-toggle-header').forEach(el => { el.innerHTML = el.innerText.replace('▼', '▶'); });
    element.style.display = 'block';

    // Se acabou de abrir a seção "Exceções", renderiza a lista na hora
    if (id === "exceptions-content" && typeof renderExceptionsList === "function") {
      renderExceptionsList();
    }

    header.innerHTML = header.innerText.replace('▶', '▼');
  }
}

function printReport() {
    if (typeof currentClassContext === 'undefined' || !currentClassContext) { 
        alert('Selecione uma turma primeiro!'); 
        return; 
    }
    
    const students = masterData[currentClassContext];
    if (!students || students.length === 0) { 
        alert('Nenhum aluno nesta turma.'); 
        return; 
    }
    
    students.sort((a, b) => a.name.localeCompare(b.name));
    
    const limit = (typeof config !== 'undefined' && config.minGrade) ? parseFloat(config.minGrade) : 6.0;
    const logoUrl = "LOGO GP.png"; 

    const win = window.open('', '', 'width=1100,height=850');
    if(!win) { alert("Permita pop-ups para imprimir!"); return; }

    let htmlContent = '';
    
    // Lista de matérias (Garante que não dê erro se SUBJECTS sumir)
    const listaMaterias = (typeof SUBJECTS !== 'undefined') ? SUBJECTS : ['Português','Matemática','História','Geografia','Ciências','Arte','Inglês','Educação Física'];

    // Loop para processar os alunos (2 por página)
    for (let i = 0; i < students.length; i += 2) {
        
        const renderSingle = (std) => {
            if (!std) return '<div class="boletim-box" style="border:none; visibility:hidden;"></div>';

            let rows = '';
            
            listaMaterias.forEach((subj, idx) => {
                let sumGrades = 0, countGrades = 0, tds = '';
                
                // 1. Notas Bimestrais
                for (let b = 0; b < 4; b++) {
                    let gradeKey = idx * 4 + b;
                    let val = (std.grades && std.grades[gradeKey] != null && std.grades[gradeKey] !== "") ? parseFloat(std.grades[gradeKey]) : null;
                    
                    tds += `<td>${val !== null ? val.toFixed(1) : '-'}</td>`;
                    if (val !== null) { sumGrades += val; countGrades++; }
                }
                
                // 2. CÁLCULO DE FALTAS (USANDO A NOVA FUNÇÃO AJUDANTE)
                let nFaltas = contarFaltasPorMateria(std, subj);
                
                // 3. Média e Recuperação
                let avg = countGrades > 0 ? (sumGrades / countGrades) : 0;
                let finalGrade = avg;
                
                if (std.recup && std.recup[idx]) {
                   let r = std.recup[idx];
                   if(r.nota && r.nota !== "") {
                        finalGrade = ((avg * (10 - r.peso)) + (parseFloat(r.nota) * r.peso)) / 10;
                   }
                }

                let color = finalGrade >= limit ? '#000' : '#d32f2f';
                let status = finalGrade >= limit ? 'APR' : 'CONS';
                
                rows += `<tr>
                    <td class="subj-td">${subj}</td>
                    ${tds}
                    <td style="font-weight:bold; background:#f0f0f0;">${finalGrade.toFixed(1)}</td>
                    <td style="font-weight:bold; color:blue;">${nFaltas}</td>
                    <td style="font-weight:bold; color:${color};">${status}</td>
                </tr>`;
            });

            return `
            <div class="boletim-box">
                <div class="boletim-header">
                    <img src="${logoUrl}" class="logo-img" onerror="this.style.display='none'">
                    <div class="school-details">
                        <h2>COLÉGIO GP - BOLETIM ESCOLAR</h2>
                        <p><b>ALUNO(A):</b> ${std.name.toUpperCase()}</p>
                        <p><b>TURMA:</b> ${currentClassContext} | <b>ANO:</b> 2026</p>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th style="text-align:left;">DISCIPLINA</th>
                            <th>1ºB</th><th>2ºB</th><th>3ºB</th><th>4ºB</th>
                            <th>MÉD.</th><th>FALTAS</th><th>SIT.</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        };

        htmlContent += `
        <div class="print-page">
            ${renderSingle(students[i])}
            <div class="visual-spacer"></div>
            ${renderSingle(students[i+1])}
        </div>`;
    }

    win.document.write(`
        <html>
        <head>
            <title>Impressão Boletins GP</title>
            <style>
                @page { size: A4 landscape; margin: 0; }
                body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background: #fff; }
                .no-print-bar {
                    background: #1a237e; color: #fff; padding: 10px; text-align: center;
                    position: fixed; top: 0; width: 100%; z-index: 999;
                }
                .btn-p { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
                .print-page { width: 297mm; height: 210mm; display: flex; flex-direction: column; align-items: center; padding-top: 5mm; box-sizing: border-box; page-break-after: always; }
                .boletim-box { width: 270mm; height: 85mm; padding: 4mm; box-sizing: border-box; border: 1.5px solid #000; border-radius: 8px; }
                .visual-spacer { height: 6mm; width: 270mm; border-bottom: 1px dashed #999; margin: 4mm 0; }
                .boletim-header { display: flex; align-items: center; gap: 20px; margin-bottom: 6px; }
                .logo-img { max-width: 120px; max-height: 65px; object-fit: contain; }
                .school-details h2 { margin: 0; color: #1a237e; font-size: 1.3em; border-bottom: 2px solid #1a237e; display: inline-block; }
                .school-details p { margin: 2px 0; font-size: 0.9em; }
                table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
                th, td { border: 1px solid #000; padding: 3px; text-align: center; }
                th { background-color: #f2f2f2; }
                .subj-td { text-align: left; padding-left: 8px; font-weight: bold; width: 28%; }

    if(selectedClasses.length === 0) return alert('Selecione pelo menos uma turma.');
    if(selectedMonths.length === 0) return alert('Selecione pelo menos um mês.');

    let fullHtml = '';
    const monthNames = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

    // Mapeia os meses selecionados em texto legível para o alerta e para o log
    const mesesNomes = selectedMonths.map(mIndex => monthNames[mIndex - 1]).join(', ');

    selectedClasses.forEach(cls => {
        if(!masterData[cls] || masterData[cls].length === 0) return;
        selectedMonths.forEach(monthIndex => {
            const daysInMonth = new Date(year, monthIndex, 0).getDate();
            const monthName = monthNames[monthIndex - 1];

            let tableHtml = `<div style="padding:20px; font-family:'Arial', sans-serif; page-break-inside: avoid; margin-bottom: 40px; border-bottom: 2px dashed #ccc;">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:10px;">
                    <div><img src="LOGO GP.png" style="height:50px;"></div>
                    <div style="text-align:right;">
                        <h2 style="margin:0;">DIÁRIO DE PRESENÇA</h2>
                        <p style="margin:0;">${cls} - ${monthName}/${year}</p>
                    </div>
                </div>
                <table border="1" cellspacing="0" width="100%" style="border-collapse:collapse; font-size:0.8em; text-align:center;">
                    <thead><tr style="background:#eee;"><th style="width:20px;">Nº</th><th style="text-align:left; padding-left:5px;">NOME DO ALUNO</th>`;
        
            for(let d=1; d<=daysInMonth; d++) tableHtml += `<th style="width:20px;">${d}</th>`;
            tableHtml += `<th style="width:40px;">TOTAL</th></tr></thead><tbody>`;

            masterData[cls].forEach((std, idx) => {
                tableHtml += `<tr><td>${idx+1}</td><td style="text-align:left; padding-left:5px; white-space:nowrap;">${std.name}</td>`;
                let totalF = 0;
                for(let d=1; d<=daysInMonth; d++) {
                    const dateKey = `${year}-${String(monthIndex).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    let symbol = '';
                    if(std.diary && std.diary[dateKey]) {
                        const entry = std.diary[dateKey];
                        
                        if(entry.faltas === 0) {
                            symbol = '<span style="color: #28a745; font-weight: bold;">P</span>';
                        } else {
                            if(entry.just && entry.just.trim() !== "") {
                                symbol = '<span style="color: #FF8C00; font-weight: bold;">FJ</span>';
                            } else {
                                symbol = '<span style="color: #dc3545; font-weight: bold;">F</span>';
                                totalF++; 
                            }
                        }
                    }
                    tableHtml += `<td>${symbol}</td>`;
                }
                tableHtml += `<td style="font-weight:bold;">${totalF || ''}</td></tr>`;
            });
            tableHtml += `</tbody></table>
                <div style="margin-top:20px; font-size:0.8em;">
                    Legenda: <b style="color:#28a745">P</b> (Presente) | <b style="color:#dc3545">F</b> (Falta) | <b style="color:#FF8C00">FJ</b> (Justificada/Atestado)
                </div></div>`;
            fullHtml += tableHtml;
        });
    });

    // ==========================================
    // O ESPIÃO REGISTRA A GERAÇÃO DO DIÁRIO
    // ==========================================
    try {
        if (typeof registrarLog === 'function') {
            registrarLog("GERAÇÃO DE DIÁRIO", `Gerou diário de presença para a(s) turma(s): ${selectedClasses.join(", ")} | Ano: ${year} | Mês(es): ${mesesNomes}.`);
        }
    } catch(e) { console.error("Erro no espião de geração de diário:", e); }

    // ==========================================
    // MEGA ALERTA DETALHADO (PADRÃO OURO)
    // ==========================================
    alert(`✅ DIÁRIO DE PRESENÇA GERADO COM SUCESSO!\n\n📋 DETALHES DO RELATÓRIO:\n• Ano Base: ${year}\n• Turma(s): ${selectedClasses.join(", ")}\n• Mês(es): ${mesesNomes}\n\nStatus: Documento formatado e pronto para visualização/impressão.`);

    const modal = document.getElementById('print-modal');
        
   modal.innerHTML = `
    <div class="modal-content" style="width:95%; height:90vh; display:flex; flex-direction:column;">
        <div id="att-area" style="flex:1; overflow:auto; background:white;">${fullHtml}</div>
        
        <div class="no-print" style="padding:15px; display:flex; justify-content:center; gap:20px; background:#f8f9fa; border-top:1px solid #eee;">
            
            <button onclick="document.getElementById('print-modal').style.display='none'" 
                    style="width: 150px; height: 45px;
                           background-color: #ffebee !important; 
                           color: #c62828 !important; 
                           border: 1px solid #ffcdd2 !important; 
                           box-shadow: 0px 4px 0px #ef5350 !important; 
                           border-radius: 8px !important; 
                           font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.1s;"
                    onmousedown="this.style.boxShadow='0px 2px 0px #ef5350'; this.style.transform='translateY(2px)'"
                    onmouseup="this.style.boxShadow='0px 4px 0px #ef5350'; this.style.transform='translateY(0)'"
                    onmouseleave="this.style.boxShadow='0px 4px 0px #ef5350'; this.style.transform='translateY(0)'">
                ✖ FECHAR

// 1. MOTOR INFALÍVEL PARA ACHAR O USUÁRIO LOGADO
// =========================================================
function obterEmailLogado() {
    const session = localStorage.getItem('gp_v9_session');
    if (session && users[session]) return session;
    
    for (let email in users) {
        if (currentUser && users[email].displayName === currentUser.displayName) {
            return email;
        }
    }
    return null; 
}

// 2. ATUALIZAR MEU PRÓPRIO PERFIL (Fim do erro Sessão Perdida)
// =========================================================
window.saveMyProfile = async function() {
    const newName = document.getElementById('my-name').value.trim();
    const newPass = document.getElementById('my-new-pass').value.trim();
    const meuEmail = obterEmailLogado();

    if (!meuEmail) return alert('❌ Sessão perdida. Atualize a página e faça login novamente.');
    if (newName === '') return alert('⚠️ O nome não pode ficar vazio!');

    // Atualiza a Memória Local
    users[meuEmail].displayName = newName;
    if (newPass !== "") users[meuEmail].password = newPass;
    
    // Atualiza cargo se houver hífen no nome próprio
    if (newName.includes('-')) {
        users[meuEmail].role = newName.split('-')[1].trim();
    }
    
    currentUser = users[meuEmail];
    localStorage.setItem('gp_v9_users', JSON.stringify(users));

    // ==========================================
    // 1. SALVAMENTO ISOLADO NO FIREBASE
    // ==========================================
    try {
        document.getElementById('my-name').disabled = true;
        await db.collection("sistema").doc("usuarios").set(users);
        document.getElementById('my-name').disabled = false;
    } catch(e) {
        document.getElementById('my-name').disabled = false;
        console.error("Erro no Firebase:", e);
        return alert('❌ Erro ao tentar atualizar o perfil no Firebase: ' + (e.message || 'Erro desconhecido'));
    }

    document.getElementById('my-new-pass').value = "";

    // ==========================================
    // 2. O ESPIÃO REGISTRA A ATUALIZAÇÃO DO PERFIL
    // ==========================================
    try {
        let detalheSenha = newPass !== "" ? " e alterou a senha" : "";
        registrarLog("ATUALIZAÇÃO DE PERFIL", `O usuário (${meuEmail}) atualizou seu próprio perfil para "${newName}"${detalheSenha}.`);
    } catch(e) { console.error("Erro no espião de atualização de perfil:", e); }

    // ==========================================
    // 3. ALERTA DETALHADO DE SUCESSO
    // ==========================================
    alert(`✅ Perfil atualizado com sucesso!\n\nEmail: ${meuEmail}\nNome de Exibição: ${newName}\nSenha: ${newPass !== "" ? "Alterada para a nova senha" : "Mantida a mesma"}`);
    
    // Atualiza apenas as configurações (sem jogar você para a Home)
    if(typeof renderConfig === 'function') renderConfig();
    
    // Atualiza saudação na tela (CONFORME O SEU CÓDIGO COM BLINDAGEM DE ERRO)
    try {
        const nomeCurto = newName.split('-')[0].trim().toUpperCase();
        const textNodes = document.evaluate("//text()[contains(., 'Logado como') or contains(., 'Oi,')]", document, null, XPathResult.ANY_TYPE, null);
        let node = textNodes.iterateNext();
        while(node) {
            if(node.nodeValue.includes(nomeCurto) || node.nodeValue.includes('Logado')) {
                node.nodeValue = `Oi, ${nomeCurto}!`;
            }
            node = textNodes.iterateNext();
        }
    } catch(xpathErr) {
        console.error("Erro ao atualizar texto de saudação via XPath:", xpathErr);
    }

    // ==========================================
    // 4. MÁGICA CERTEIRA PARA MANTER A ABA ABERTA
    // ==========================================
    setTimeout(() => {
        const abaConteudo = document.getElementById('profile-config-content');
        if (abaConteudo) {
            abaConteudo.style.display = 'block';
            abaConteudo.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }, 300);
};

    }

    document.getElementById('admin-new-pass').value = ''; 

    // ==========================================

window.adminToggleBlock = async function() {
    const email = document.getElementById('admin-user-block').value;
    if (!email) return alert('⚠️ Selecione um usuário na lista.');

    const nomeUsuario = users[email] ? users[email].displayName : email;
    const isBlocked = users[email].blocked;
    const acao = isBlocked ? 'DESBLOQUEAR' : 'BLOQUEAR';
    
    if (!confirm(`Atenção: Deseja realmente ${acao} o acesso de ${nomeUsuario}?`)) return;

    users[email].blocked = !isBlocked;
    localStorage.setItem('gp_v9_users', JSON.stringify(users));

    // ==========================================
    // 1. SALVAMENTO ISOLADO NO FIREBASE
    // ==========================================
    try {
        document.body.style.cursor = 'wait';
        await db.collection("sistema").doc("usuarios").set(users);
        document.body.style.cursor = 'default';
    } catch(e) {
        document.body.style.cursor = 'default';
        console.error("Erro no Firebase:", e);
        return alert('❌ Erro ao salvar o bloqueio/desbloqueio no Firebase: ' + (e.message || 'Erro desconhecido'));
    }

    // O novo status após a inversão
    const novoStatusTexto = !isBlocked ? 'BLOQUEADO 🔒' : 'DESBLOQUEADO 🔓';

    // ==========================================
    // 2. O ESPIÃO REGISTRA A ALTERAÇÃO DE ACESSO
    // ==========================================
    try {
        registrarLog("ALTERAÇÃO DE ACESSO", `O Administrador alterou o status de acesso do usuário ${nomeUsuario} (${email}) para: ${novoStatusTexto}.`);
    } catch(e) { console.error("Erro no espião de alteração de acesso:", e); }

    // ==========================================
    // 3. ALERTA DETALHADO E ESTILIZADO EM LISTA
    // ==========================================
    alert(`✅ Status de acesso atualizado com sucesso!\n\nEmail: ${email}\nNome: ${nomeUsuario}\nNovo Status: ${novoStatusTexto}`);

// Armazenamento: fica dentro do config (vai junto com saveSystem)
function getExceptionsStore() {
  if (!config) config = {};
  if (!config.exceptions) config.exceptions = {}; 
  // Formato:
  // config.exceptions["2026-02-02"] = { blocked: true/false, label: "texto", ts: 123456789 }
  return config.exceptions;
}


function isDateBlockedByExceptions(dateKey) {
  const ex = (config && config.exceptions) ? config.exceptions : {};
  return !!(dateKey && ex[dateKey] && ex[dateKey].blocked);
}


function isDateBlockedByExceptions(dateKey) {
  const store = (config && config.exceptions) ? config.exceptions : {};
  return !!(store && store[dateKey] && store[dateKey].blocked);
}


function saveExceptionsStore(store) {
  if (!config) config = {};
  config.exceptions = store || {};
  if (typeof saveSystem === "function") saveSystem();
}

function renderExceptionsList() {
  const box = document.getElementById("exc-list");
  if (!box) return; // ainda não abriu a seção, então não tem DOM

  const store = getExceptionsStore();
  const keys = Object.keys(store || {}).sort(); // datas em ordem

  if (!keys.length) {
    box.innerHTML = `<div style="color:#777; font-size:0.85em;">* Nenhuma exceção cadastrada.</div>`;
    return;
  }

  box.innerHTML = keys.map(dateKey => {
    const it = store[dateKey] || {};
    const blocked = !!it.blocked;
    const label = (it.label || "").toString().trim();

    const tag = blocked
      ? `<span style="display:inline-block; padding:2px 8px; border-radius:999px; background:#ffebee; color:#c62828; font-weight:bold; font-size:12px;">BLOQUEADO</span>`
      : `<span style="display:inline-block; padding:2px 8px; border-radius:999px; background:#e8f5e9; color:#2e7d32; font-weight:bold; font-size:12px;">LIBERADO</span>`;

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 10px; background:#fff; border:1px solid #eee; border-radius:8px; margin-bottom:8px;">
        <div style="min-width:0;">
          <div style="font-weight:bold; color:#263238;">${dateKey} ${tag}</div>
          <div style="font-size:0.85em; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${label ? label.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "<i>(sem motivo)</i>"}
          </div>
        </div>
        <button title="Apagar" onclick="deleteException('${dateKey}')"
                style="width:35px; height:35px; background-color:#ffebee !important; color:#c62828 !important; border:1px solid #ffcdd2 !important; box-shadow:0px 3px 0px #ef9a9a !important; border-radius:6px !important; cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center; transition:0.1s;"
                onmousedown="this.style.boxShadow='0px 1px 0px #ef9a9a'; this.style.transform='translateY(2px)'"
                onmouseup="this.style.boxShadow='0px 3px 0px #ef9a9a'; this.style.transform='translateY(0)'"
                onmouseleave="this.style.boxShadow='0px 3px 0px #ef9a9a'; this.style.transform='translateY(0)'">
          ✖
        </button>
      </div>
    `;
  }).join("");
}

function setException(isBlocked) {
  // Permissão: só os 3 podem bloquear/liberar
  if (!canOverrideDates()) {
    return alert("Sem permissão: apenas Coordenação/Direção pode bloquear/liberar datas.");
  }

  const dateEl = document.getElementById("exc-date");
  const labelEl = document.getElementById("exc-label");

  if (!dateEl) return alert("Campo de data não encontrado.");
  const dateKey = String(dateEl.value || "").trim();
  if (!dateKey) return alert("Escolha uma data.");

  const label = labelEl ? String(labelEl.value || "").trim() : "";

  const store = getExceptionsStore();
  store[dateKey] = {
    blocked: !!isBlocked,  // true = BLOQUEADO, false = LIBERADO
    label: label,
    ts: Date.now()
  };

  saveExceptionsStore(store);
  renderExceptionsList();
  alert(isBlocked ? "Data bloqueada!" : "Data liberada!");
}


function deleteException(dateKey) {
  // Permissão: só os 3 podem apagar (isso “libera” removendo a exceção)
  if (!canOverrideDates()) {
    return alert("Sem permissão: apenas Coordenação/Direção pode apagar exceções.");
  }

  if (!dateKey) return;
  const ok = confirm(`Apagar a exceção do dia ${dateKey}?`);
  if (!ok) return;

  const store = getExceptionsStore();
  if (store[dateKey]) delete store[dateKey];

  saveExceptionsStore(store);
  renderExceptionsList();
}

// Regra mestre: se tiver exceção cadastrada, ela manda no dia inteiro.
// Se não tiver, cai na regra automática (data não letiva) se existir.
function isDateBlocked(dateKey) {
  if (!dateKey) return false;

  const store = getExceptionsStore();
  const it = store?.[dateKey];

  // Exceção cadastrada sempre vence:
  if (it && typeof it.blocked === "boolean") return it.blocked;

  // Sem exceção: usa bloqueio automático do sistema (se existir)
  if (typeof isClassDateBlocked === "function") return isClassDateBlocked(dateKey);

  return false;
}

function guardDateOrStop(dateKey, contexto = "AÇÃO") {
  if (!isDateBlocked(dateKey)) return true;

  const store = getExceptionsStore();
  const it = store?.[dateKey] || {};
  const motivo = (it.label || "").toString().trim();

  if (typeof alertBlockedDate === "function") {
    alertBlockedDate(dateKey, contexto);
  } else {
    alert(`🚫 ${contexto} bloqueada em ${dateKey}.${motivo ? "\nMotivo: " + motivo : ""}`);
  }
  return false;
}

        function saveStudyGuide() {
    // 1) Validações iniciais (mantidas iguais ao seu código original)
    const teacherName = document.getElementById('doc-teacher').value;
    const generalDateInput = document.getElementById('roteiro-data').value;
    if (!teacherName) return alert('Selecione o Professor.');
    
    const isMulti = document.getElementById('check-multi-dates') && document.getElementById('check-multi-dates').checked;
    if (!isMulti && !generalDateInput) return alert('Preencha a Data Geral.');
    
    const items = document.querySelectorAll('#roteiro-items-container > div');
    if (items.length === 0) return alert('Adicione conteúdo.');

    // 2) Varrer os itens para montar o resumo (Bimestres, Turmas, Matérias e Datas)
    let bimestres = new Set();
    let turmas = new Set();
    let materias = new Set();
    let datas = new Set();

    for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const b = item.querySelector('.item-bimestre').value;
        const t = item.querySelector('.item-turma').value;
        const m = item.querySelector('.item-materia').value;
        const specDateEl = item.querySelector('.item-specific-date');
        const finalDateIso = (specDateEl && specDateEl.value) ? specDateEl.value : generalDateInput;

        // Se faltar data em algum item específico, já bloqueamos aqui
        if(!finalDateIso) { 
            return alert(`Atenção: A turma ${t} está sem data definida!`); 
        }

        bimestres.add(b);
        turmas.add(t);
        materias.add(m);

        // Formata a data para padrão BR no resumo
        const dObj = new Date(finalDateIso);
        const dataBR = `${String(dObj.getUTCDate()).padStart(2,'0')}/${String(dObj.getUTCMonth()+1).padStart(2,'0')}/${dObj.getFullYear()}`;
        datas.add(dataBR);
    }

    // Transforma o Set em texto separado por vírgula (evita repetições na tela)
    const bimestresStr = Array.from(bimestres).join(', ');
    const turmasStr = Array.from(turmas).join(', ');
    const materiasStr = Array.from(materias).join(', ');
    const datasStr = Array.from(datas).join(', ');

    // 3) Chama o Modal de Confirmação
    const modal = document.getElementById("print-modal");
    
    modal.innerHTML = `
        <div class="no-print" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9998;"></div>
        <div class="modal-content modal-sm" style="position:relative; z-index:9999; max-width:450px; text-align:center;">
            <h3 style="color:#0277bd;">⚠️ CONFIRMAR ROTEIRO</h3>
            <p style="text-align:left;">Confirme os dados antes de gerar o documento:</p>
            <div style="text-align:left; background:#f0f8ff; border: 1px solid #cce4ff; padding:10px; border-radius:5px; font-size:14px; margin-bottom:15px; color:#333;">
                <div><b>Bimestre(s):</b> ${bimestresStr}</div>
                <div style="margin-top:5px;"><b>Data(s):</b> ${datasStr}</div>
                <div style="margin-top:5px;"><b>Turma(s):</b> ${turmasStr}</div>
                <div style="margin-top:5px;"><b>Matéria(s):</b> ${materiasStr}</div>
            </div>
            <p><b>Deseja gerar o roteiro agora?</b></p>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="main-button" style="flex:1; background:#4caf50 !important; color:#fff !important; border:none !important;" onclick="confirmarSaveStudyGuide()">SIM</button>
                <button class="main-button" style="flex:1; background:#ef5350 !important; color:#fff !important; border:none !important;" onclick="document.getElementById('print-modal').style.display='none'">NÃO</button>
            </div>
        </div>
    `;
    modal.style.display = "block";
}


// ESTA É A NOVA FUNÇÃO QUE EXECUTA O SEU CÓDIGO ORIGINAL APÓS O "SIM"
function confirmarSaveStudyGuide() {
    // Esconde o modal
    document.getElementById('print-modal').style.display = 'none';

    // =========================================================
    // SEU CÓDIGO ORIGINAL INTACTO ABAIXO (COM AJUSTES DE BIMESTRE E IMPRESSÃO)
    // =========================================================
    const teacherName = document.getElementById('doc-teacher').value;
    const generalDateInput = document.getElementById('roteiro-data').value;
    const items = document.querySelectorAll('#roteiro-items-container > div');
    
    let htmlBody = '', lastTurma = '', lastDate = ''; 
    const formatDateBR = (isoDate) => { if(!isoDate) return '____/____/____'; const d = new Date(isoDate); return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
    const getYear = (isoDate) => isoDate ? new Date(isoDate).getFullYear() : new Date().getFullYear();
    
    // CABEÇALHO ATUALIZADO: Com Bimestre e Trava de Quebra de Página (page-break-inside: avoid)
    const getHeaderHTML = (teacherName, dateStr, yearStr, bimText) => `<div class="header-blindado" style="page-break-inside: avoid; break-inside: avoid;"><div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 5px;"><div><img src="LOGO GP.png" alt="Logo GP" class="logo-icone"></div><div style="text-align:right;"><h1 style="margin: 0; font-size: 1.2em; text-transform: uppercase;">ROTEIRO DE ESTUDOS - ${bimText}</h1><h3 style="margin: 5px 0 0 0; font-weight: 400; color: #555;">Colégio GP - ${yearStr}</h3></div></div><div style="display:flex; justify-content:space-between; width:100%; margin-bottom: 5px; font-size: 1.1em;"><strong style="text-align:left;">Professor: ${teacherName}</strong><strong style="text-align:right;">Data da Avaliação: ${dateStr}</strong></div></div>`;
    
    // Variável extra para juntar os bimestres e enviar para o banco depois
    let bimestresParaBanco = new Set();

    for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const materia = item.querySelector('.item-materia').value;
        const turma = item.querySelector('.item-turma').value;
        
        // Captura o Bimestre deste item específico
        const bimestreInput = item.querySelector('.item-bimestre');
        const bimestre = bimestreInput ? bimestreInput.value : '';
        if(bimestre) bimestresParaBanco.add(bimestre);

        const specificDateEl = item.querySelector('.item-specific-date');
        const finalDateIso = (specificDateEl && specificDateEl.value) ? specificDateEl.value : generalDateInput;
        const dataBR = formatDateBR(finalDateIso), year = getYear(finalDateIso);
        
        if (turma !== lastTurma || dataBR !== lastDate) {
            if (i > 0) htmlBody += '<div class="quebra-serie" style="height: 60px; width:100%;"></div>';           
            // Passamos o Bimestre para o cabeçalho
            htmlBody += getHeaderHTML(teacherName, dataBR, year, bimestre);
            lastTurma = turma; lastDate = dataBR;
        }
        
        let refType = item.querySelector('.item-ref-type').value.replace('s', ''); 
        const refVal = item.querySelector('.item-pages').value, contentRaw = item.querySelector('.item-content').value;
        const refs = refVal.split(',').map(r => r.trim()).filter(r => r), contents = contentRaw.replace(/\.$/, '').split(';').map(c => c.trim()).filter(c => c); 
        let linhasHTML = '';
        const createTextLine = (label, text, pontuacao) => `<div class="roteiro-linha-texto"><span class="roteiro-label-bold">${label}:</span>&nbsp;${text}${pontuacao}</div>`;
        
        if (refs.length > 0 && refs.length === contents.length) {
            for(let j=0; j<refs.length; j++) {
                const pontuacao = (j === refs.length - 1) ? '.' : ';';
                let label = refType; if (refs[j].includes('-')) label = refType + 's';
                linhasHTML += createTextLine(`${label} ${refs[j]}`, contents[j], pontuacao);
            }
        } else {
            if(refVal) {
                let displayLabel = refType; if (refVal.includes('-') || refVal.includes(',')) displayLabel = refType + 's';
                if(contents.length === 0) linhasHTML += createTextLine(`${displayLabel} ${refVal}`, '', '.');
                else linhasHTML += `<div class="roteiro-linha-texto"><span class="roteiro-label-bold">${displayLabel} ${refVal}:</span></div>`;
            }
            contents.forEach((c, index2) => { const pontuacao = (index2 === contents.length - 1) ? '.' : ';'; linhasHTML += `<div class="roteiro-linha-texto">${c}${pontuacao}</div>`; });
        }
        
        // BLOCO ATUALIZADO: Com Trava de Quebra de Página (page-break-inside: avoid)
        htmlBody += `<div class="bloco-indivisivel" style="page-break-inside: avoid; break-inside: avoid;"><h4 class="titulo-materia-compacto">${materia} - ${turma}</h4><div class="bloco-questao">${linhasHTML}</div></div>`;
    } 
    
    // === 3º PASSO: SALVA NO BANCO DE DADOS ===
    const bimestresStr = Array.from(bimestresParaBanco).join(', ');
    salvarRoteiroBancoDeDados(teacherName, bimestresStr, htmlBody);

    showRoteiroPreview({ body: htmlBody, teacher: teacherName });
}


function salvarRoteiroBancoDeDados(professor, bimestre, conteudoHTML) {
    try {
        const dataAtual = new Date();
        const dataCriacaoBR = `${String(dataAtual.getDate()).padStart(2, '0')}/${String(dataAtual.getMonth() + 1).padStart(2, '0')}/${dataAtual.getFullYear()} às ${String(dataAtual.getHours()).padStart(2, '0')}:${String(dataAtual.getMinutes()).padStart(2, '0')}`;
        
        const idUnico = 'roteiro_' + Date.now();
        const novoRoteiro = {
            id: idUnico,
            professor: professor || "Não informado",
            bimestre: bimestre || "Não informado",
            dataCriacao: dataCriacaoBR,
            timestamp: Date.now(),
            htmlConteudo: conteudoHTML
        };

        // 1. Puxa os roteiros que já existem no seu sistema (ou cria vazio se não tiver)
        let roteirosSalvos = JSON.parse(localStorage.getItem('gp_v9_roteiros')) || {};
        
        // 2. Adiciona o novo roteiro nessa lista
        roteirosSalvos[idUnico] = novoRoteiro;
        
        // 3. Salva de volta no sistema usando a sua mesma filosofia do saveSystem()
        localStorage.setItem('gp_v9_roteiros', JSON.stringify(roteirosSalvos));
        
        // console.log("Roteiro salvo com sucesso no LocalStorage do sistema!");
    } catch (erro) {
        console.error("Erro ao salvar o roteiro:", erro);
    }
}

function verRoteirosSalvos() {
    let roteirosSalvos = JSON.parse(localStorage.getItem('gp_v9_roteiros')) || {};
    let htmlLista = '';
    const chaves = Object.keys(roteirosSalvos);

    if (chaves.length === 0) {
        htmlLista = '<p style="text-align:center; color:#777; margin-top:20px;">Nenhum roteiro salvo ainda.</p>';
    } else {
        const lista = chaves.map(key => roteirosSalvos[key]).sort((a, b) => b.timestamp - a.timestamp);
        
        lista.forEach(roteiro => {
            htmlLista += `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fbff; border:1px solid #d9ebff; padding:12px; margin-bottom:10px; border-radius:6px;">
                    <div style="text-align:left;">
                        <strong style="color:#0056b3; font-size:15px;">${roteiro.bimestre} - Prof. ${roteiro.professor}</strong><br>
                        <span style="color:#666; font-size:12px;">Gerado em: ${roteiro.dataCriacao}</span>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="main-button" style="background:#f3e5f5 !important; color:#6a1b9a !important; border:1px solid #e1bee7 !important; border-radius:4px; padding:6px 12px; cursor:pointer; font-weight:bold;" 
                        onclick="abrirRoteiroAntigo('${roteiro.id}')">🖨️ ABRIR</button>
                        
                        <button class="main-button" style="background:#fff5f5 !important; color:#dc3545 !important; border:1px solid #fcdada !important; border-radius:4px; padding:6px 12px; cursor:pointer; font-weight:bold;" 
                        onclick="excluirRoteiroAntigo('${roteiro.id}')">🗑️ EXCLUIR</button>
                    </div>
                </div>
            `;
        });
    }

    const modal = document.getElementById("print-modal");
    modal.innerHTML = `
        <div class="no-print" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9998;"></div>
        <div class="modal-content modal-sm" style="position:relative; z-index:9999; max-width:650px; max-height:80vh; overflow-y:auto; text-align:center; padding:20px; background:#fff; border-radius:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;">
                <h3 style="margin:0; color:#333;">📁 Histórico de Roteiros</h3>
                <button style="background:#fffafa; color:#dc3545; border:1px solid #fcdada; border-radius:4px; padding:6px 12px; cursor:pointer; font-weight:bold;" onclick="document.getElementById('print-modal').style.display='none'">✖ FECHAR</button>
            </div>
            ${htmlLista}
        </div>
    `;
    modal.style.display = "block";
}

// 1. FUNÇÃO QUE CHAMA O ALERTA BONITÃO
function excluirRoteiroAntigo(idDoRoteiro) {
    // Busca os dados do roteiro para mostrar na tela o que está sendo apagado
    let roteirosSalvos = JSON.parse(localStorage.getItem('gp_v9_roteiros')) || {};
    const roteiro = roteirosSalvos[idDoRoteiro];

    if (!roteiro) return alert("Roteiro não encontrado.");

    // Substitui o conteúdo do modal pela tela de confirmação de exclusão
    const modal = document.getElementById("print-modal");
    
    modal.innerHTML = `
        <div class="no-print" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9998;"></div>
        <div class="modal-content modal-sm" style="position:relative; z-index:9999; max-width:450px; text-align:center; padding:20px; background:#fff; border-radius:8px;">
            <h3 style="color:#c62828; margin-top:0;">🗑️ CONFIRMAR EXCLUSÃO</h3>
            <p style="text-align:left;">Você está prestes a apagar <b>permanentemente</b> o seguinte roteiro:</p>
            
            <div style="text-align:left; background:#fff5f5; border: 1px solid #fcdada; padding:10px; border-radius:5px; font-size:14px; margin-bottom:15px; color:#333;">
                <div><b>Bimestre:</b> ${roteiro.bimestre}</div>
                <div style="margin-top:5px;"><b>Professor:</b> ${roteiro.professor}</div>
                <div style="margin-top:5px;"><b>Gerado em:</b> ${roteiro.dataCriacao}</div>
            </div>
            
            <p><b>Tem certeza que deseja excluir? Essa ação não pode ser desfeita.</b></p>
            
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="main-button" style="flex:1; background:#ef5350 !important; color:#fff !important; border:none !important; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;" 
                onclick="confirmarExclusaoRoteiro('${idDoRoteiro}')">SIM, EXCLUIR</button>
                
                <button class="main-button" style="flex:1; background:#9e9e9e !important; color:#fff !important; border:none !important; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;"

            </div>
        </div>
    `;
}

// 2. FUNÇÃO QUE EXECUTA A EXCLUSÃO DE FATO (Acionada pelo botão SIM)
function confirmarExclusaoRoteiro(idDoRoteiro) {
    let roteirosSalvos = JSON.parse(localStorage.getItem('gp_v9_roteiros')) || {};			
    
    // Deleta o roteiro da memória
    if (roteirosSalvos[idDoRoteiro]) {
        delete roteirosSalvos[idDoRoteiro];
        localStorage.setItem('gp_v9_roteiros', JSON.stringify(roteirosSalvos));
    }

function admSaveWeights() {
    const cls = document.getElementById('adm-class-sel').value;
    const subjSel = document.getElementById('adm-subj-sel');
    const subj = subjSel ? subjSel.value : '';
    const subjNome = (subjSel && subjSel.selectedIndex >= 0) ? subjSel.options[subjSel.selectedIndex].text : subj;
    const bim = document.getElementById('adm-bim-sel').value;
    
    let comps = [];
    const nameInputs = document.querySelectorAll('.w-name'); 
    const valInputs = document.querySelectorAll('.w-val');

    // 1. Coleta os dados dos inputs
    nameInputs.forEach((n, i) => {
        if(n.value) {
            let val = parseFloat(valInputs[i].value.replace(',','.')) || 0;
            comps.push({ name: n.value, w: val });
        }
    });

    // 2. Validação de Soma (Limite 10.0)
    const total = comps.reduce((sum, item) => sum + item.w, 0);
    if (total > 10.05) { 
        alert(`🚫 AÇÃO BLOQUEADA!\nA soma dos pesos deu ${total.toFixed(1)}. O máximo permitido é 10.0.`);
        return;
    }

    // 3. Montagem do resumo para o alerta
    let resumoPesos = comps.map(c => `• ${c.name}: ${c.w.toFixed(1)}`).join('\n');
    let mensagemConfirmacao = `⚠️ Confirma o salvamento desta configuração?\n\n` +
                              `Turma: ${cls}\n` +
                              `Matéria: ${subjNome}\n` +
                              `Bimestre: ${bim}º\n\n` +
                              `Pesos definidos:\n${resumoPesos}\n\n` +
                              `Total: ${total.toFixed(1)}/10.0`;

    // 4. Trava de Confirmação (O seu "Super Alerta" com OK)
    const confirmou = confirm(mensagemConfirmacao);
    
    if (!confirmou) {
        alert("Ação cancelada.");
        return; // Sai da função sem salvar nada
    }

    // 5. Salva no banco de dados (Apenas se clicar em OK)
    if(!mediaConfig[cls]) mediaConfig[cls] = {};
    if(!mediaConfig[cls][subj]) mediaConfig[cls][subj] = {};
    
    mediaConfig[cls][subj][bim] = { components: comps };
    
    saveSystem();

    // ==========================================
    // O ESPIÃO REGISTRA A CONFIGURAÇÃO DE PESOS
    // ==========================================
    try {
        let resumoLog = comps.map(c => `${c.name} (${c.w.toFixed(1)})`).join(', ');
        registrarLog("CONFIGURAÇÃO DE PESOS", `Definiu os pesos de ${subjNome} (${bim}º Bimestre) na turma ${cls}. Componentes: [${resumoLog}] (Total: ${total.toFixed(1)})`);
    } catch(e) { console.error("Erro no espião de pesos:", e); }

    alert('✅ Pesos de ' + subjNome + ' salvos com sucesso!');
}

function renderConselhoBoard() {
  const modal = document.getElementById("print-modal");
  const year = new Date().getFullYear();
  const limit = parseFloat(config?.minGrade ?? 6);

// Permissão (BLOCO 3.1): Júnior, Coordenação e Direção podem ajustar nota
  // (Mantém compatível com o seu padrão atual do portal)
  const dn = String(currentUser?.displayName || "").toLowerCase();
  const role = String(currentUser?.role || "").toLowerCase();

  const canAdjust =
    dn.includes("júnior") || dn.includes("junior") ||           // Júnior
    role.includes("coorden") || dn.includes("adriana") ||       // Coordenação
    role.includes("diretor") || dn.includes("sheila");          // Direção


  // Helpers
  const parseAnoSerie = (turma) => {
    const m = String(turma).match(/^(\d+)\s*ANO/i);
    return m ? parseInt(m[1], 10) : 999;
  };

  const parseBR = (v) => {
    if (v === null || v === undefined || v === "") return null;
    const s = String(v).trim().replace(",", ".");
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  };

  // Regra que você descreveu: média final parcial baseada no bimestre escolhido (1..4)
  // 1B => soma/1, 2B => soma/2, 3B => soma/3, 4B => soma/4, ignorando vazios
  const mediaFinalParcialAte = (std, materiaIdx, ateBim) => {
    let sum = 0;
    let count = 0;
    for (let b = 1; b <= ateBim; b++) {
      const idxNota = materiaIdx * 4 + (b - 1);
      const val = parseBR(std?.grades?.[idxNota]);
      if (val !== null) { sum += val; count++; }
    }
    if (count === 0) return null;
    const avg = sum / count;
    return Math.round((avg + Number.EPSILON) * 10) / 10; // 1 casa
  };


// Monta uma lista de "ocorrências" (uma linha por aluno+matéria+bimestre em conselho)
let rows = [];
Object.keys(masterData).forEach(cls => {
  const alunos = masterData[cls] || [];
  alunos.forEach((std, stdIdx) => {
    SUBJECTS.forEach((subj, materiaIdx) => {
      for (let bim = 1; bim <= 4; bim++) {

        // 1) Guardinha: se o bimestre não tem nota, pula (não entra no relatório)
        const idxNotaBim = materiaIdx * 4 + (bim - 1);
        const notaDoBimestre = parseBR(std?.grades?.[idxNotaBim]);
        if (notaDoBimestre === null) continue;

        // 2) Agora sim calcula a média parcial e decide se vai pro conselho
        const mFinal = mediaFinalParcialAte(std, materiaIdx, bim);
        if (mFinal !== null && mFinal < limit) {
          rows.push({
            aluno: std.name,
            turma: cls,
            ano: parseAnoSerie(cls),
            materia: subj,
            bimestre: bim,
            media: mFinal,
            stdRef: std,
            materiaIdx,
            cls
          });
        }
      }
    });
  });
});

// Ordenação: Ano/Série => Turma => Aluno => Matéria => Bimestre
  rows.sort((a, b) => {
    if (a.ano !== b.ano) return a.ano - b.ano;
    if (a.turma !== b.turma) return a.turma.localeCompare(b.turma);
    if (a.aluno !== b.aluno) return a.aluno.localeCompare(b.aluno);
    if (a.materia !== b.materia) return a.materia.localeCompare(b.materia);
    return a.bimestre - b.bimestre;
  });

  // HTML das linhas com “pular uma linha quando mudar de ano/série”
  let bodyHtml = "";
  let lastAno = null;

  if (rows.length === 0) {
    bodyHtml = `<tr><td colspan="6" style="text-align:center; padding:14px;">Parabéns! Nenhum aluno no conselho.</td></tr>`;
  } else {
    rows.forEach((r, i) => {
      if (lastAno !== null && r.ano !== lastAno) {
        bodyHtml += `
          <tr class="ano-sep">
            <td colspan="6"> </td>
          </tr>
        `;
      }
      lastAno = r.ano;

const bimTxt = `${r.bimestre}º`;
      const mediaTxt = (r.media !== null) ? r.media.toFixed(1).replace(".", ",") : "-";

      // ALTERADO: Cor alterada para #f2f2f2 (Cinza muito claro/Gelo)
      const actionBtn = canAdjust
        ? `<button class="main-button no-print" style="min-width:30px; background-color: #f2f2f2 !important; color: #000000 !important; border: 1px solid #cccccc !important;"
              onclick="openConselhoAdjustModal(${i})">⚠️</button>`
        : `<span style="color:#999;">—</span>`;

      bodyHtml += `
        <tr>
          <td style="text-align:left; padding-left:10px; font-weight:600;">${r.aluno}</td>
          <td style="text-align:center;">${r.turma}</td>
          <td style="text-align:center;">${r.materia}</td>
          <td style="text-align:center; font-weight:700; color:#c0392b;">${mediaTxt}</td>
          <td style="text-align:center;">${bimTxt}</td>
          <td class="no-print" style="text-align:center;">${actionBtn}</td>
        </tr>
      `;
    });
  }

// Guardamos as linhas globalmente para o modal de ajuste
  window.__conselhoRows = rows;

modal.innerHTML = `

function printConselhoNow() {
  const sheet = document.getElementById("conselho-print-sheet");
  const modal = document.getElementById("print-modal");

  const target = sheet || modal;
  if (!target) return alert("print-modal não encontrado.");

  const inner = sheet
    ? sheet.outerHTML
    : (modal.querySelector("#conselho-print-sheet")?.outerHTML || modal.innerHTML);

  const win = window.open("", "", "height=800,width=1200");
  if (!win) return alert("Permita pop-ups para imprimir!");

  win.document.write(`
    <html>
      <head>
        <title>Conselho - Relatório</title>
        <style>
          @page { margin: 26mm 18mm 18mm 18mm; }
          html, body { margin: 0; padding: 0; background: #fff; }

          .sheet-pad{ box-sizing: border-box; padding: 26mm 18mm 18mm 18mm; }
          #conselho-print-sheet{ width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; box-shadow: none !important; background: #fff !important; overflow: visible !important; height: auto !important; max-height: none !important; }
          table { width: 100%; border-collapse: collapse; }
          th, td { border: 1px solid #000; }
          table.conselho-table { font-size: 11px; }
          table.conselho-table th, table.conselho-table td { padding: 5px; }
          thead { display: table-header-group; }
          tfoot { display: table-footer-group; }
          tr { page-break-inside: avoid; break-inside: avoid; }
          .no-print, button { display: none !important; }
        </style>
      </head>
      <body>
        <div class="sheet-pad">
          ${inner}
        </div>
      </body>
    </html>
  `);

  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 250);
}

function applyConselhoAdjust(rowIndex) {
  const rows = window.__conselhoRows || [];
  const r = rows[rowIndex];
  if (!r) return alert("Registro não encontrado.");

  const input = document.getElementById("conselho-new-grade");
  if (!input) return alert("Campo de nota não encontrado.");

  // Aceita 7,5 ou 7.5
  let raw = String(input.value || "").trim();
  if (!raw) return alert("Digite a nova nota.");
  raw = raw.replace(",", ".");
  let n = parseFloat(raw);
  if (isNaN(n)) return alert("Nota inválida.");

  // Trava 0..10 e 1 casa
  if (n < 0) n = 0;
  if (n > 10) n = 10;
  n = Math.round((n + Number.EPSILON) * 10) / 10;

  // Descobre o índice do bimestre na grade 1D
  const idxNota = (r.materiaIdx * 4) + (r.bimestre - 1);

  // Aplica no próprio aluno referenciado
  if (!r.stdRef) return alert("Referência do aluno não encontrada.");
  if (!r.stdRef.grades) r.stdRef.grades = [];
  r.stdRef.grades[idxNota] = n;

  saveSystem();          // salva no seu localStorage/banco (função já existe no sistema) [file:90]
  alert(`Ajuste aplicado! Nova nota: ${n.toFixed(1).replace(".", ",")}`);

  // Reabre o relatório já atualizado
  renderConselhoBoard();
}

function deleteConselhoGrade(rowIndex) {
  const rows = window.__conselhoRows || [];
  const r = rows[rowIndex];
  if (!r) return alert("Registro não encontrado.");

  // Alerta de segurança (o seu pedido de "excelentes alertas")
  if (!confirm(`⚠️ ATENÇÃO!\n\nVocê está prestes a REMOVER a nota do aluno ${r.aluno} na matéria ${r.materia} (${r.bimestre}º Bimestre).\n\nEssa ação é irreversível. Deseja continuar?`)) {
      return; 
  }

  // Descobre o índice da nota
  const idxNota = (r.materiaIdx * 4) + (r.bimestre - 1);

  // Zera a nota no banco de dados (null faz o sistema ignorar)
  if (r.stdRef && r.stdRef.grades) {
    r.stdRef.grades[idxNota] = null;
  }

  saveSystem();
  alert("✅ Registro removido com sucesso!");
  renderConselhoBoard();
}
